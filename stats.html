<script>
  const DB_NAME = "patientChartDB";
  const STORE = "patients";
  const $ = id => document.getElementById(id);
  const SERVER_MODE = location.protocol === "http:" || location.protocol === "https:";

  let allRecords = [];
  const CHART_METRICS = [
    { key: "avgVisitsPerDay", label: "진료 환자", axis: "count", color: "#39a9f5", title: value => `진료 환자 ${value.toFixed(1)}명` },
    { key: "avgNewPatientsPerDay", label: "초진", axis: "count", color: "#ffca6a", title: value => `초진 ${value.toFixed(1)}명` },
    { key: "avgChunaPerDay", label: "추나", axis: "count", color: "#f97316", title: value => `추나 ${value.toFixed(1)}명` },
    { key: "avgPharmaPatientsPerDay", label: "약침", axis: "count", color: "#22c55e", title: value => `약침 ${value.toFixed(1)}명` },
    { key: "returnRate", label: "재진율", axis: "rate", color: "#a78bfa", title: value => `재진율 ${(value * 100).toFixed(1)}%` },
    { key: "thirdVisitRate", label: "삼진율", axis: "rate", color: "#fb7185", title: value => `삼진율 ${(value * 100).toFixed(1)}%` },
    { key: "chunaPatientRate", label: "추나비율", axis: "rate", color: "#38bdf8", title: value => `추나비율 ${(value * 100).toFixed(1)}%` },
    { key: "pharmaPatientRate", label: "약침비율", axis: "rate", color: "#10b981", title: value => `약침비율 ${(value * 100).toFixed(1)}%` },
    { key: "avgCombinedFeePerDay", label: "총진료비", axis: "money", color: "#4ade80", title: value => `총진료비 일평균 ${Math.round(value).toLocaleString()}원` },
    { key: "avgCombinedFeePerVisit", label: "1건 평균 진료비", axis: "money", color: "#a78bfa", unitLabel: "원/건", title: value => `1건 평균 진료비 ${Math.round(value).toLocaleString()}원` },
    { key: "avgNonCoveredFeePerDay", label: "비급여진료비", axis: "money", color: "#ffca6a", title: value => `비급여진료비 일평균 ${Math.round(value).toLocaleString()}원` }
  ];

  function getVisibleChartMetricKeys(wrapId = "chartMetricToggles", chipSelector = ".chart-metric-chip") {
    const wrap = $(wrapId);
    const chips = wrap ? [...wrap.querySelectorAll(chipSelector)] : [];
    if (!chips.length) return CHART_METRICS.map(metric => metric.key);
    return chips.filter(chip => chip.classList.contains("active")).map(chip => chip.dataset.metricKey);
  }

  function renderMetricToggles(wrapId, chipClass, activeKeys = null, metrics = CHART_METRICS) {
    const wrap = $(wrapId);
    if (!wrap) return;
    const activeSet = activeKeys ? new Set(activeKeys) : null;
    wrap.innerHTML = metrics.map(metric => `
      <button class="chart-toggle ${chipClass}${!activeSet || activeSet.has(metric.key) ? " active" : ""}" type="button" data-metric-key="${metric.key}" style="--metric-color:${metric.color}">
        <span class="chart-toggle-swatch"></span>
        ${metric.label}
      </button>
    `).join("");
  }

  function renderChartMetricToggles() {
    const chipMetrics = [
      ...CHART_METRICS.filter(metric => metric.key === "returnRate" || metric.key === "thirdVisitRate"),
      ...CHART_METRICS.filter(metric => metric.key !== "returnRate" && metric.key !== "thirdVisitRate")
    ];
    const comparisonMetrics = chipMetrics.filter(metric => metric.key !== "avgChunaPerDay" && metric.key !== "avgPharmaPatientsPerDay");
    renderMetricToggles("chartMetricToggles", "chart-metric-chip", ["avgVisitsPerDay", "avgNewPatientsPerDay", "returnRate", "thirdVisitRate"], chipMetrics);
    renderMetricToggles("periodComparisonMetricToggles", "comparison-chart-metric-chip", ["avgVisitsPerDay", "avgNewPatientsPerDay", "returnRate", "thirdVisitRate", "avgCombinedFeePerDay", "avgCombinedFeePerVisit", "avgNonCoveredFeePerDay"], comparisonMetrics);
  }

  // ── IndexedDB 읽기 ──────────────────────────────────────────────
  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("IndexedDB 열기가 차단되었습니다."));
    });
  }
  async function loadRecords() {
    if (SERVER_MODE) {
      const res = await fetch("/api/patients", { cache: "no-store" });
      if (!res.ok) throw new Error(`서버 환자 목록 조회 실패 (${res.status})`);
      return await res.json();
    }
    const db = await openDb();
    if (!db.objectStoreNames.contains(STORE)) {
      db.close();
      throw new Error(`${DB_NAME} 안에 ${STORE} 스토어가 없습니다. (먼저 환자 데이터를 저장/가져오기 하세요)`);
    }
    try {
      return await new Promise((resolve, reject) => {
        const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
        req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
        req.onerror = () => reject(req.error);
      });
    } finally { db.close(); }
  }

  async function loadServerDoctors() {
    const res = await fetch("/api/stats/doctors", { cache: "no-store" });
    if (!res.ok) throw new Error(`서버 원장 목록 조회 실패 (${res.status})`);
    return await res.json();
  }

  async function loadServerStats(start, end, docFilter, chartUnit) {
    const params = new URLSearchParams({ start, end, unit: chartUnit || "week" });
    if (docFilter) params.set("doctor", docFilter);
    const res = await fetch(`/api/stats?${params.toString()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`서버 통계 조회 실패 (${res.status})`);
    return await res.json();
  }

  // ── 날짜 유틸 ───────────────────────────────────────────────────
  function ymd(date) {
    const d = new Date(date);
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }
  const today = () => ymd(new Date());
  function getSeoulHourFromTimestamp(timestamp) {
    const value = Number(timestamp || 0);
    if (!value) return null;
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return null;
    const hour = Number(new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      hour: "2-digit",
      hourCycle: "h23"
    }).format(date));
    return Number.isInteger(hour) && hour >= 0 && hour <= 23 ? hour : null;
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return ymd(d);
  }

  function visitDatesOf(rec) {
    const dates = Array.isArray(rec.visitDates) ? rec.visitDates.map(String) : [];
    Object.keys(rec.visitHistory || {}).forEach(d => dates.push(String(d)));
    return [...new Set(dates.filter(Boolean))].sort();
  }

  function isPrescriptionChiefComplaint(value) {
    const text = String(value || "").trim().replace(/\s+/g, "");
    return text === "처방" || text === "-처방-";
  }

  function isPrescriptionVisit(rec, date) {
    const history = rec.visitHistory || {};
    if (Object.prototype.hasOwnProperty.call(history, date)) {
      return isPrescriptionChiefComplaint(history[date]?.chiefComplaint);
    }
    return isPrescriptionChiefComplaint(rec.chiefComplaint);
  }

  function normalizeVisitType(value) {
    const text = String(value || "").trim().replace(/\s+/g, "");
    if (text.includes("초")) return "초진";
    if (text.includes("재")) return "재진";
    return "";
  }

  function getVisitRecord(rec, date) {
    return (rec.visitHistory || {})[date] || {};
  }

  function explicitNewVisitDatesOf(rec) {
    return visitDatesOf(rec).filter(date => normalizeVisitType(getVisitRecord(rec, date).visitType) === "초진");
  }

  function newVisitDatesOf(rec) {
    const explicitDates = explicitNewVisitDatesOf(rec);
    if (explicitDates.length) return explicitDates;
    const dates = visitDatesOf(rec);
    return dates.length ? [dates[0]] : [];
  }

  function nonPrescriptionVisitDatesOf(rec) {
    return visitDatesOf(rec).filter(date => !isPrescriptionVisit(rec, date));
  }

  function visitOrdinalForDate(rec = {}, targetDate = "") {
    const dates = nonPrescriptionVisitDatesOf(rec).filter(date => date <= targetDate);
    if (!dates.includes(targetDate)) return 0;
    const initials = newVisitDatesOf(rec).filter(date => date <= targetDate);
    const courseStart = initials.filter(date => date <= targetDate).at(-1) || dates[0] || targetDate;
    return dates.filter(date => date >= courseStart && date <= targetDate).length;
  }

  function isoWeekKey(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const weekYear = d.getFullYear();
    const week1 = new Date(weekYear, 0, 4);
    const weekNo = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    return `${weekYear}${String(weekNo).padStart(2, "0")}`;
  }

  function isoWeekRangeLabel(weekKey) {
    const match = String(weekKey || "").match(/^(\d{4})(\d{2})$/);
    if (!match) return "";
    const year = Number(match[1]);
    const week = Number(match[2]);
    const jan4 = new Date(year, 0, 4);
    const week1Monday = new Date(jan4);
    week1Monday.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
    const start = new Date(week1Monday);
    start.setDate(week1Monday.getDate() + (week - 1) * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const startLabel = `${start.getMonth() + 1}.${start.getDate()}`;
    const endLabel = start.getMonth() === end.getMonth() ? String(end.getDate()) : `${end.getMonth() + 1}.${end.getDate()}`;
    return `(${startLabel}-${endLabel})`;
  }

  function periodKey(dateStr, unit = "week") {
    const d = new Date(dateStr + "T00:00:00");
    const year = d.getFullYear();
    const month = d.getMonth() + 1;
    if (unit === "day") return dateStr.replaceAll("-", "");
    if (unit === "month") return `${year}${String(month).padStart(2, "0")}`;
    if (unit === "quarter") return `${year}Q${Math.ceil(month / 3)}`;
    if (unit === "year") return String(year);
    return isoWeekKey(dateStr);
  }

  function rangeDays(start, end) {
    return Math.round((new Date(end + "T00:00:00") - new Date(start + "T00:00:00")) / 86400000) + 1;
  }

  function defaultChartUnit(start, end) {
    return rangeDays(start, end) <= 30 ? "day" : "week";
  }

  function minDateStr(a, b) {
    return a <= b ? a : b;
  }

  function addMonths(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return ymd(d);
  }

  function periodBoundsFor(dateStr, unit) {
    const d = new Date(dateStr + "T00:00:00");
    const year = d.getFullYear();
    const month = d.getMonth();
    if (unit === "week") {
      const start = new Date(d);
      start.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      return { start: ymd(start), end: ymd(end) };
    }
    if (unit === "month") {
      return { start: ymd(new Date(year, month, 1)), end: ymd(new Date(year, month + 1, 0)) };
    }
    if (unit === "quarter") {
      const quarterStartMonth = Math.floor(month / 3) * 3;
      return { start: ymd(new Date(year, quarterStartMonth, 1)), end: ymd(new Date(year, quarterStartMonth + 3, 0)) };
    }
    if (unit === "year") {
      return { start: `${year}-01-01`, end: `${year}-12-31` };
    }
    return { start: dateStr, end: dateStr };
  }

  function monthBoundsForValue(value) {
    const text = String(value || "").trim();
    if (!/^\d{4}-\d{2}$/.test(text)) return null;
    const [year, month] = text.split("-").map(Number);
    return { start: `${text}-01`, end: ymd(new Date(year, month, 0)) };
  }

  function quarterKeyForDate(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return `${d.getFullYear()}Q${Math.floor(d.getMonth() / 3) + 1}`;
  }

  function quarterBoundsForKey(key) {
    const match = String(key || "").match(/^(\d{4})Q([1-4])$/);
    if (!match) return null;
    const year = Number(match[1]);
    const quarter = Number(match[2]);
    const startMonth = (quarter - 1) * 3;
    return {
      start: ymd(new Date(year, startMonth, 1)),
      end: ymd(new Date(year, startMonth + 3, 0))
    };
  }

  function quarterLabel(key) {
    const match = String(key || "").match(/^(\d{4})Q([1-4])$/);
    return match ? `${match[1]}년 ${match[2]}/4분기` : key;
  }

  function capRangeToYesterday(range) {
    const yesterday = addDays(today(), -1);
    if (!range) return null;
    return { start: range.start, end: minDateStr(range.end, yesterday) };
  }

  function previousPeriodBounds(currentStart, currentEnd, unit) {
    const elapsedDays = rangeDays(currentStart, currentEnd);
    const previousFull = periodBoundsFor(addDays(currentStart, -1), unit);
    return {
      start: previousFull.start,
      end: minDateStr(addDays(previousFull.start, elapsedDays - 1), previousFull.end)
    };
  }

  function comparisonDetailUnit(comparisonUnit) {
    if (comparisonUnit === "month") return "week";
    return comparisonUnit === "quarter" || comparisonUnit === "year" ? "month" : "day";
  }

  function slotLabelForKey(key, unit) {
    const text = String(key || "");
    if (unit === "day" && /^\d{8}$/.test(text)) return `${Number(text.slice(4, 6))}.${Number(text.slice(6, 8))}`;
    if (unit === "week") return `W${text.slice(-2)}`;
    if (unit === "month" && /^\d{6}$/.test(text)) return `${Number(text.slice(4, 6))}월`;
    if (unit === "quarter") return text.replace("Q", "-Q");
    if (unit === "year") return text;
    return text;
  }

  function comparisonSlots(range, detailUnit) {
    const slots = [];
    const pushByCursor = stepFn => {
      const seen = new Set();
      for (let cursor = range.start; cursor <= range.end; cursor = stepFn(cursor)) {
        const key = periodKey(cursor, detailUnit);
        if (!seen.has(key)) {
          seen.add(key);
          slots.push({ key, label: slotLabelForKey(key, detailUnit) });
        }
      }
      return slots;
    };
    if (detailUnit === "day") {
      return pushByCursor(cursor => addDays(cursor, 1));
    }
    if (detailUnit === "week") {
      return pushByCursor(cursor => addDays(cursor, 7));
    }
    if (detailUnit === "month") {
      let cursor = range.start.slice(0, 8) + "01";
      const last = range.end.slice(0, 8) + "01";
      while (cursor <= last) {
        const key = periodKey(cursor, "month");
        slots.push({ key, label: slotLabelForKey(key, "month") });
        cursor = addMonths(cursor, 1).slice(0, 8) + "01";
      }
      return slots;
    }
    if (detailUnit === "quarter") {
      let cursor = periodBoundsFor(range.start, "quarter").start;
      const last = periodBoundsFor(range.end, "quarter").start;
      while (cursor <= last) {
        const key = periodKey(cursor, "quarter");
        slots.push({ key, label: slotLabelForKey(key, "quarter") });
        cursor = addMonths(cursor, 3);
      }
      return slots;
    }
    return pushByCursor(cursor => addMonths(cursor, 12));
  }

  function rowsForComparison(stats, range, detailUnit) {
    const byKey = new Map((stats?.trendStats || []).map(row => [String(row.key), row]));
    return comparisonSlots(range, detailUnit).map(slot => ({
      ...slot,
      ...(byKey.get(String(slot.key)) || {})
    }));
  }

  async function loadPeriodComparison(currentStart, currentEnd, docFilter, detailUnit = "day") {
    const current = { start: currentStart, end: currentEnd };
    const includeYearAgo = currentEnd < addMonths(currentStart, 12);
    const previousEnd = addDays(currentStart, -1);
    const previous = {
      start: addDays(previousEnd, -(rangeDays(currentStart, currentEnd) - 1)),
      end: previousEnd
    };
    const yearAgo = {
      start: addMonths(currentStart, -12),
      end: addMonths(currentEnd, -12)
    };
    const loader = SERVER_MODE
      ? (from, to) => loadServerStats(from, to, docFilter, detailUnit)
      : (from, to) => computeStats(from, to, docFilter, detailUnit);
    const [currentStats, previousStats, yearAgoStats] = await Promise.all([
      loader(current.start, current.end),
      loader(previous.start, previous.end),
      includeYearAgo ? loader(yearAgo.start, yearAgo.end) : Promise.resolve(null)
    ]);
    return { current, previous, yearAgo: includeYearAgo ? yearAgo : null, currentStats, previousStats, yearAgoStats, detailUnit };
  }

  function visitsWithinDays(dates, startDate, days, referenceDate = "") {
    const followupEnd = addDays(startDate, days - 1);
    const endDate = referenceDate && referenceDate < followupEnd ? referenceDate : followupEnd;
    return dates.filter(d => d >= startDate && d <= endDate).length;
  }

  function hasFullFollowupWindow(firstDate, referenceDate, days = 21) {
    return firstDate <= addDays(referenceDate, -days);
  }

  // ── 집계 ────────────────────────────────────────────────────────
  // docFilter: "" = 전체, 그 외에는 해당 원장이 본 진료만 집계
  function normalizeTreatmentStatName(name) {
    const text = String(name || "").trim();
    if (text === "추나" || text === "단추") return "단순추나";
    if (text === "복추") return "복잡추나";
    return text;
  }

  function isSimpleChunaTreatment(name) {
    const text = String(name || "").trim();
    return text === "추나" || text === "단추" || text === "단순추나";
  }

  function isComplexChunaTreatment(name) {
    const text = String(name || "").trim();
    return text === "복추" || text === "복잡추나";
  }

  function isPharmaTreatment(name) {
    return String(name || "").trim().includes("약침");
  }

  function packagePurchaseDatesInRange(record = {}, start = "", end = "") {
    const packages = record.packages && typeof record.packages === "object" ? record.packages : {};
    const dates = [];
    Object.entries(packages).forEach(([key, pkg]) => {
      if (!String(key || "").startsWith("p")) return;
      const purchases = Array.isArray(pkg?.purchases) ? pkg.purchases : [];
      purchases.forEach(entry => {
        const date = String(entry?.date || "").trim();
        const qty = Number(entry?.qty ?? entry?.totalQty ?? 0) || 0;
        if (qty > 0 && date >= start && date <= end) dates.push(date);
      });
    });
    return [...new Set(dates)];
  }

  function hasPackagePurchaseInRange(record = {}, start = "", end = "") {
    return packagePurchaseDatesInRange(record, start, end).length > 0;
  }

  function createStatsTrendBucket(key) {
    return {
      key,
      visits: 0,
      coreVisits: 0,
      newPatients: 0,
      followupEligibleNewPatients: 0,
      returningPatients: 0,
      thirdVisitPatients: 0,
      chunaTotal: 0,
      simpleChunaTotal: 0,
      complexChunaTotal: 0,
      pharmaTotal: 0,
      patientIds: new Set(),
      prescriptionPatientIds: new Set(),
      chunaPatientIds: new Set(),
      pharmaPatientIds: new Set(),
      pharmaPackagePurchasePatientIds: new Set(),
      dates: new Set(),
      clinicDates: new Set()
    };
  }

  function getStatsTrendBucket(trendBuckets, key) {
    if (!trendBuckets[key]) trendBuckets[key] = createStatsTrendBucket(key);
    return trendBuckets[key];
  }

  function computeStats(start, end, docFilter = "", chartUnit = "week") {
    const inRange = d => d >= start && d <= end;
    const patientSet = new Set();
    const prescriptionPatientSet = new Set();
    const newPatientSet = new Set();
    let visits = 0;
    let coreVisits = 0;
    let prescriptionVisits = 0;
    let newPatients = 0;
    let followupEligibleNewPatients = 0;
    let returningPatients = 0;
    let thirdVisitPatients = 0;
    let matureFollowupEligibleNewPatients = 0;
    let matureReturningPatients = 0;
    let matureThirdVisitPatients = 0;
    const treatmentCounts = {};
    let pharmaTotal = 0;       // 약침 합계 (약침1~4·L·자)
    let chunaTotal = 0;
    let simpleChunaTotal = 0;
    let complexChunaTotal = 0;
    const chunaPatientSet = new Set();
    const simpleChunaPatientSet = new Set();
    const complexChunaPatientSet = new Set();
    const pharmaPatientSet = new Set();
    const pharmaTypesByPatient = new Map();
    const pharmaPackagePurchasePatientSet = new Set();
    const clinicDateSet = new Set();
    const doctorCounts = {};
    const weekdayCounts = {};
    const weekdayDateSets = {};
    const treatmentComboCounts = {};
    const trendBuckets = {};
    const visitStageCounts = { first: 0, second: 0, third: 0, fourthPlus: 0 };
    const hourlyPatientCounts = Object.fromEntries(Array.from({ length: 24 }, (_, hour) => [String(hour).padStart(2, "0"), 0]));
    const hourlyPatientCountsByDayType = {
      weekday: Object.fromEntries(Array.from({ length: 24 }, (_, hour) => [String(hour).padStart(2, "0"), 0])),
      saturday: Object.fromEntries(Array.from({ length: 24 }, (_, hour) => [String(hour).padStart(2, "0"), 0]))
    };
    const nurseAssignmentsByDate = {};
    let unknownTimeVisits = 0;
    const heatmapWeekdays = ["일", "월", "화", "수", "목", "금", "토"];
    const weekdayHourlyCounts = Object.fromEntries(heatmapWeekdays.map(day => [day, Object.fromEntries(Array.from({ length: 10 }, (_, index) => [String(index + 9).padStart(2, "0"), 0]))]));

    for (const rec of allRecords) {
      const dates = visitDatesOf(rec);
      if (!dates.length) continue;
      const pid = String(rec.patientId || rec.chartNo || rec.name || Math.random());
      let matchedCore = false;

      for (const date of dates.filter(inRange)) {
        const entry = (rec.visitHistory || {})[date] || {};
        const doc = String(entry.doctorName || "").trim();
        if (docFilter && doc !== docFilter) continue;   // 원장 필터
        const visitHour = getSeoulHourFromTimestamp(entry.timestamp);
        if (visitHour === null) unknownTimeVisits += 1;
        else {
          const hourKey = String(visitHour).padStart(2, "0");
          hourlyPatientCounts[hourKey] += 1;
          const day = new Date(date + "T00:00:00").getDay();
          if (day >= 1 && day <= 5) {
            const clinicHourKey = String(Math.min(18, Math.max(9, visitHour))).padStart(2, "0");
            hourlyPatientCountsByDayType.weekday[clinicHourKey] += 1;
            weekdayHourlyCounts[heatmapWeekdays[day]][clinicHourKey] += 1;
          } else if (day === 6) {
            const clinicHourKey = String(Math.min(14, Math.max(9, visitHour))).padStart(2, "0");
            hourlyPatientCountsByDayType.saturday[clinicHourKey] += 1;
            weekdayHourlyCounts[heatmapWeekdays[day]][clinicHourKey] += 1;
          }
        }
        const nurseName = String(entry.nurseName || "").trim() || "미지정";
        if (!nurseAssignmentsByDate[date]) nurseAssignmentsByDate[date] = {};
        nurseAssignmentsByDate[date][nurseName] = (nurseAssignmentsByDate[date][nurseName] || 0) + 1;
        const isPrescription = isPrescriptionVisit(rec, date);
        visits += 1;
        const treatments = Array.isArray(entry.treatments) ? entry.treatments : [];
        const weekday = ["일", "월", "화", "수", "목", "금", "토"][new Date(date + "T00:00:00").getDay()];
        weekdayCounts[weekday] = (weekdayCounts[weekday] || 0) + 1;
        if (!weekdayDateSets[weekday]) weekdayDateSets[weekday] = new Set();
        weekdayDateSets[weekday].add(date);
        const key = periodKey(date, chartUnit);
        const trendBucket = getStatsTrendBucket(trendBuckets, key);
        trendBucket.visits += 1;
        trendBucket.dates.add(date);
        if (isPrescription) {
          prescriptionVisits += 1;
          prescriptionPatientSet.add(pid);
          trendBucket.prescriptionPatientIds.add(pid);
        } else {
          matchedCore = true;
          coreVisits += 1;
          const visitOrdinal = visitOrdinalForDate(rec, date);
          if (visitOrdinal === 1) visitStageCounts.first += 1;
          else if (visitOrdinal === 2) visitStageCounts.second += 1;
          else if (visitOrdinal === 3) visitStageCounts.third += 1;
          else if (visitOrdinal >= 4) visitStageCounts.fourthPlus += 1;
          clinicDateSet.add(date);
          trendBucket.coreVisits += 1;
          trendBucket.patientIds.add(pid);
          trendBucket.clinicDates.add(date);
        }
        let countedPharma = false;
        let countedChuna = false;
        let countedSimpleChuna = false;
        let countedComplexChuna = false;
        const comboParts = [];
        for (const tRaw of treatments) {
          const t = normalizeTreatmentStatName(tRaw);
          if (!t) continue;
          treatmentCounts[t] = (treatmentCounts[t] || 0) + 1;
          comboParts.push(t);
          if (!isPrescription && isSimpleChunaTreatment(t) && !countedSimpleChuna) {
            simpleChunaTotal += 1;
            simpleChunaPatientSet.add(pid);
            trendBucket.simpleChunaTotal += 1;
            countedSimpleChuna = true;
          }
          if (!isPrescription && isComplexChunaTreatment(t) && !countedComplexChuna) {
            complexChunaTotal += 1;
            complexChunaPatientSet.add(pid);
            trendBucket.complexChunaTotal += 1;
            countedComplexChuna = true;
          }
          if (!isPrescription && (isSimpleChunaTreatment(t) || isComplexChunaTreatment(t)) && !countedChuna) {
            chunaTotal += 1;
            chunaPatientSet.add(pid);
            trendBucket.chunaTotal += 1;
            trendBucket.chunaPatientIds.add(pid);
            countedChuna = true;
          }
          if (isPharmaTreatment(t)) {
            if (!isPrescription) {
              pharmaPatientSet.add(pid);
              if (!pharmaTypesByPatient.has(pid)) pharmaTypesByPatient.set(pid, new Set());
              pharmaTypesByPatient.get(pid).add(t);
              trendBucket.pharmaPatientIds.add(pid);
            }
            if (!countedPharma) {
              pharmaTotal += 1;
              trendBucket.pharmaTotal += 1;
              countedPharma = true;
            }
          }
        }
        const combo = [...new Set(comboParts)].sort((a, b) => a.localeCompare(b, "ko")).join(" + ");
        if (combo) treatmentComboCounts[combo] = (treatmentComboCounts[combo] || 0) + 1;
        if (doc) doctorCounts[doc] = (doctorCounts[doc] || 0) + 1;
      }

      if (matchedCore) patientSet.add(pid);
      const packagePurchaseDates = packagePurchaseDatesInRange(rec, start, end);
      if (packagePurchaseDates.length) pharmaPackagePurchasePatientSet.add(pid);
      packagePurchaseDates.forEach(date => {
        const key = periodKey(date, chartUnit);
        getStatsTrendBucket(trendBuckets, key).pharmaPackagePurchasePatientIds.add(pid);
      });

      // visitType이 있으면 해당 날짜의 초진 표시를 우선하고, 없던 과거 데이터만 첫 방문일을 초진으로 본다.
      for (const firstDate of newVisitDatesOf(rec)) {
        if (!inRange(firstDate) || isPrescriptionVisit(rec, firstDate)) continue;
        const firstDoc = String(getVisitRecord(rec, firstDate).doctorName || rec.doctorName || "").trim();
        if (docFilter && firstDoc !== docFilter) continue;
        newPatients += 1;
        newPatientSet.add(pid);
        const key = periodKey(firstDate, chartUnit);
        if (trendBuckets[key]) trendBuckets[key].newPatients += 1;
        const nonPrescriptionDates = nonPrescriptionVisitDatesOf(rec);
        // 기간 종료 뒤의 재진은 과거 기간 수치에 소급 반영하지 않는다.
        const followupVisitCount = visitsWithinDays(nonPrescriptionDates, firstDate, 21, end);
        const isReturning = followupVisitCount >= 2;
        const isThirdVisit = followupVisitCount >= 3;
        if (trendBuckets[key]) {
          if (isReturning) trendBuckets[key].returningPatients += 1;
          if (isThirdVisit) trendBuckets[key].thirdVisitPatients += 1;
        }
        followupEligibleNewPatients += 1;
        if (isReturning) returningPatients += 1;
        if (isThirdVisit) thirdVisitPatients += 1;
        if (hasFullFollowupWindow(firstDate, end, 21)) {
          matureFollowupEligibleNewPatients += 1;
          if (isReturning) matureReturningPatients += 1;
          if (isThirdVisit) matureThirdVisitPatients += 1;
        }
        if (trendBuckets[key]) trendBuckets[key].followupEligibleNewPatients += 1;
      }
    }

    Object.keys(weekdayCounts).forEach(day => {
      const clinicDays = Math.max(1, weekdayDateSets[day]?.size || 0);
      weekdayCounts[day] = weekdayCounts[day] / clinicDays;
    });

    const trendStats = Object.values(trendBuckets)
      .sort((a, b) => a.key.localeCompare(b.key))
      .map(w => {
        const clinicDays = Math.max(1, w.clinicDates.size || w.dates.size);
        const uniquePatients = w.patientIds.size;
        const chunaTypeTotal = w.simpleChunaTotal + w.complexChunaTotal;
        return {
          key: w.key,
          clinicDays,
          visits: w.visits,
          newPatients: w.newPatients,
          followupEligibleNewPatients: w.followupEligibleNewPatients,
          returningPatients: w.returningPatients,
          thirdVisitPatients: w.thirdVisitPatients,
          avgVisitsPerDay: w.coreVisits / clinicDays,
          avgNewPatientsPerDay: w.newPatients / clinicDays,
          avgPrescriptionPatientsPerDay: w.prescriptionPatientIds.size / clinicDays,
          avgChunaPerDay: w.chunaTotal / clinicDays,
          chunaPatientRate: uniquePatients ? w.chunaPatientIds.size / uniquePatients : 0,
          simpleChunaRate: chunaTypeTotal ? w.simpleChunaTotal / chunaTypeTotal : 0,
          complexChunaRate: chunaTypeTotal ? w.complexChunaTotal / chunaTypeTotal : 0,
          pharmaPatientRate: uniquePatients ? w.pharmaPatientIds.size / uniquePatients : 0,
          avgPharmaPatientsPerDay: w.pharmaTotal / clinicDays,
          avgPharmaPackagePurchasePatientsPerDay: w.pharmaPackagePurchasePatientIds.size / clinicDays,
          returnRate: w.newPatients ? w.returningPatients / w.newPatients : 0,
          thirdVisitRate: w.newPatients ? w.thirdVisitPatients / w.newPatients : 0
        };
      });
    const clinicDays = Math.max(1, clinicDateSet.size);
    const chunaPatientRate = patientSet.size ? chunaPatientSet.size / patientSet.size : 0;
    const chunaTypeTotal = simpleChunaTotal + complexChunaTotal;
    const simpleChunaRate = chunaTypeTotal ? simpleChunaTotal / chunaTypeTotal : 0;
    const complexChunaRate = chunaTypeTotal ? complexChunaTotal / chunaTypeTotal : 0;
    const pharmaPatientRate = patientSet.size ? pharmaPatientSet.size / patientSet.size : 0;
    const prescriptionOnlyPatients = [...prescriptionPatientSet].filter(pid => !patientSet.has(pid)).length;
    const newUniquePatients = [...newPatientSet].filter(pid => patientSet.has(pid)).length;
    const simpleOnlyChunaPatients = [...simpleChunaPatientSet].filter(pid => !complexChunaPatientSet.has(pid)).length;
    const pharmaPatientTypeCounts = {};
    for (const types of pharmaTypesByPatient.values()) {
      const label = types.size >= 2 ? "약침 2종 이상" : [...types][0];
      if (label) pharmaPatientTypeCounts[label] = (pharmaPatientTypeCounts[label] || 0) + 1;
    }

    return {
      uniquePatients: patientSet.size,
      totalPatients: patientSet.size + prescriptionOnlyPatients,
      visits,
      coreVisits,
      prescriptionVisits,
      prescriptionPatients: prescriptionPatientSet.size,
      prescriptionOnlyPatients,
      newPatients,
      newUniquePatients,
      followupEligibleNewPatients,
      revisitPatients: Math.max(0, patientSet.size - newPatientSet.size),
      returnRate: followupEligibleNewPatients ? returningPatients / followupEligibleNewPatients : 0,
      thirdVisitRate: followupEligibleNewPatients ? thirdVisitPatients / followupEligibleNewPatients : 0,
      matureReturnRate: matureFollowupEligibleNewPatients ? matureReturningPatients / matureFollowupEligibleNewPatients : 0,
      matureThirdVisitRate: matureFollowupEligibleNewPatients ? matureThirdVisitPatients / matureFollowupEligibleNewPatients : 0,
      avgVisitsPerPatient: patientSet.size ? coreVisits / patientSet.size : 0,
      pharmaTotal,
      chunaTotal,
      simpleChunaTotal,
      complexChunaTotal,
      chunaPatients: chunaPatientSet.size,
      simpleOnlyChunaPatients,
      complexChunaPatients: complexChunaPatientSet.size,
      chunaPatientRate,
      simpleChunaRate,
      complexChunaRate,
      pharmaPatients: pharmaPatientSet.size,
      pharmaPatientTypeCounts,
      pharmaPatientRate,
      avgChunaPerDay: chunaTotal / clinicDays,
      avgPharmaPatientsPerDay: pharmaTotal / clinicDays,
      pharmaPackagePurchasePatients: pharmaPackagePurchasePatientSet.size,
      clinicDays,
      treatmentCounts,
      doctorCounts,
      weekdayCounts,
      treatmentComboCounts,
      visitStageCounts,
      hourlyPatientCounts,
      hourlyPatientCountsByDayType,
      weekdayHourlyStats: {
        counts: weekdayHourlyCounts,
        clinicDays: Object.fromEntries(Object.entries(weekdayDateSets).map(([day, dates]) => [day, dates.size]))
      },
      unknownTimeVisits,
      nurseAssignmentsByDate,
      trendStats
    };
  }

  // 데이터에 등장하는 모든 원장 목록
  function collectDoctors() {
    const set = new Set();
    for (const rec of allRecords) {
      Object.values(rec.visitHistory || {}).forEach(e => {
        const d = String(e?.doctorName || "").trim();
        if (d) set.add(d);
      });
    }
    return [...set].sort((a, b) => a.localeCompare(b, "ko"));
  }

  function populateDoctorFilter() {
    const sel = $("doctorFilter");
    const prev = sel.value;
    const docs = collectDoctors();
    sel.innerHTML = `<option value="">전체</option>` + docs.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    if (docs.includes(prev)) sel.value = prev;
  }

  async function populateServerDoctorFilter() {
    const sel = $("doctorFilter");
    const prev = sel.value;
    const docs = await loadServerDoctors();
    sel.innerHTML = `<option value="">전체</option>` + docs.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    if (docs.includes(prev)) sel.value = prev;
  }

  // ── 렌더 ────────────────────────────────────────────────────────
  function summaryComparison(current, previous, options = {}) {
    const currentValue = Number(current || 0);
    const previousValue = Number(previous || 0);
    const digits = Number(options.digits || 0);
    const isRate = Boolean(options.rate);
    const previousDisplay = isRate
      ? `${(previousValue * 100).toFixed(digits)}%`
      : `${previousValue.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}${options.suffix || ""}`;
    const difference = currentValue - previousValue;
    if (Math.abs(difference) < 1e-12) {
      return `<div class="metric-compare neutral"><span>― 0.0%</span><span class="metric-compare-previous">(이전 ${previousDisplay} · 동일)</span></div>`;
    }
    if (!previousValue && !isRate) {
      return `<div class="metric-compare neutral"><span>― 비교 불가</span><span class="metric-compare-previous">(이전 ${previousDisplay})</span></div>`;
    }
    const changeText = isRate
      ? `${Math.abs(difference * 100).toFixed(1)}%p`
      : `${Math.abs((difference / previousValue) * 100).toFixed(1)}%`;
    return `<div class="metric-compare ${difference > 0 ? "increase" : "decrease"}"><span>${difference > 0 ? "▲" : "▼"} ${changeText}</span><span class="metric-compare-previous">(이전 ${previousDisplay})</span></div>`;
  }

  function renderSummary(s, previous = {}) {
    const totalAverage = total => {
      const value = Number(total || 0);
      const clinicDays = Number(s.clinicDays || 0);
      const average = clinicDays ? value / clinicDays : 0;
      return `<span>${value.toLocaleString()}</span><span class="metric-average">/ ${average.toFixed(1)}</span>`;
    };
    const averageComparison = (currentTotal, previousTotal) => {
      const currentDays = Number(s.clinicDays || 0);
      const previousDays = Number(previous.clinicDays || 0);
      const currentAverage = currentDays ? Number(currentTotal || 0) / currentDays : 0;
      const previousAverage = previousDays ? Number(previousTotal || 0) / previousDays : 0;
      return summaryComparison(currentAverage, previousAverage, { digits: 1 });
    };
    const currentClinicDays = Number(s.clinicDays || 0);
    const previousClinicDays = Number(previous.clinicDays || 0);
    $("summaryClinicDays").textContent = `진료일 ${currentClinicDays.toLocaleString()}일${previousClinicDays ? ` · 이전 ${previousClinicDays.toLocaleString()}일` : ""}`;
    $("summaryMetrics").innerHTML = `
      <div class="metric"><div class="metric-label">진료 건수</div><div class="metric-value metric-total-average accent">${totalAverage(s.visits)}</div><div class="metric-sub">약환을 포함한 전체 진료 기록 수</div>${averageComparison(s.visits, previous.visits)}</div>
      <div class="metric"><div class="metric-label">환자 수</div><div class="metric-value metric-total-average">${totalAverage(s.totalPatients)}</div><div class="metric-sub">진료 환자와 약환 전용 환자를 합친 실인원</div>${averageComparison(s.totalPatients, previous.totalPatients)}</div>
      <div class="metric"><div class="metric-label">약환</div><div class="metric-value metric-total-average accent">${totalAverage(s.prescriptionPatients)}</div><div class="metric-sub">주상병명 처방 기록이 있는 실인원</div>${averageComparison(s.prescriptionPatients, previous.prescriptionPatients)}</div>
      <div class="metric"><div class="metric-label">진료 환자 수</div><div class="metric-value metric-total-average">${totalAverage(s.uniquePatients)}</div><div class="metric-sub">약환 전용 환자를 제외한 진료 실인원</div>${averageComparison(s.uniquePatients, previous.uniquePatients)}</div>
      <div class="metric"><div class="metric-label">초진</div><div class="metric-value metric-total-average gold">${totalAverage(s.newPatients)}</div><div class="metric-sub">선택 기간 중 초진으로 기록된 환자</div>${averageComparison(s.newPatients, previous.newPatients)}</div>
      <div class="metric"><div class="metric-label">약침 건수</div><div class="metric-value metric-total-average gold">${totalAverage(s.pharmaTotal)}</div><div class="metric-sub">약침1~4·L·자 시행 수 · 진료 1회당 1건</div>${averageComparison(s.pharmaTotal, previous.pharmaTotal)}</div>
      <div class="metric"><div class="metric-label">추나 건수</div><div class="metric-value metric-total-average accent">${totalAverage(s.chunaTotal)}</div><div class="metric-sub">단순·복잡추나 시행 수 · 진료 1회당 1건</div>${averageComparison(s.chunaTotal, previous.chunaTotal)}</div>
      <div class="metric"><div class="metric-label">약침패키지 결제 환자수</div><div class="metric-value metric-total-average">${totalAverage(s.pharmaPackagePurchasePatients)}</div><div class="metric-sub">선택 기간 중 약침 패키지를 결제한 실인원</div>${averageComparison(s.pharmaPackagePurchasePatients, previous.pharmaPackagePurchasePatients)}</div>
      <div class="metric"><div class="metric-label">환자 1명당 평균 방문</div><div class="metric-value accent">${Number(s.avgVisitsPerPatient || 0).toFixed(1)}회</div><div class="metric-sub">진료 환자의 기간 내 평균 방문 횟수</div>${summaryComparison(s.avgVisitsPerPatient, previous.avgVisitsPerPatient, { digits: 1, suffix: "회" })}</div>
      <div class="metric"><div class="metric-label">재진율</div><div class="metric-value accent">${(Number(s.returnRate || 0) * 100).toFixed(1)}%</div><div class="metric-sub">현재 날짜 기준 최근 21일 초진 포함</div>${summaryComparison(s.returnRate, previous.returnRate, { rate: true, digits: 1 })}</div>
      <div class="metric"><div class="metric-label">삼진율</div><div class="metric-value">${(Number(s.thirdVisitRate || 0) * 100).toFixed(1)}%</div><div class="metric-sub">현재 날짜 기준 최근 21일 초진 포함</div>${summaryComparison(s.thirdVisitRate, previous.thirdVisitRate, { rate: true, digits: 1 })}</div>
    `;
    renderSummaryBreakdowns(s);
    renderCohortFunnel(s);
  }

  function renderCohortFunnel(s = {}) {
    const wrap = $("cohortFunnelWrap");
    const funnel = s.cohortFunnel || {};
    const eligible = Number(funnel.eligible || 0);
    if (!eligible) { wrap.innerHTML = `<div class="empty">21일 추적이 완료된 초진 데이터 없음</div>`; return; }
    const steps = [
      { label: "초진", value: eligible, color: "#ffca6a" },
      { label: "재진 도달", value: Number(funnel.second || 0), color: "#39a9f5" },
      { label: "삼진 도달", value: Number(funnel.third || 0), color: "#fb7185" },
      { label: "4회 이상 도달", value: Number(funnel.fourthPlus || 0), color: "#4ade80" }
    ];
    wrap.innerHTML = `<div class="cohort-funnel">${steps.map(step => {
      const rate = step.value / eligible * 100;
      return `<div class="cohort-funnel-step"><div class="cohort-funnel-label">${step.label}</div><div class="cohort-funnel-value">${step.value.toLocaleString()}명</div><div class="cohort-funnel-rate">초진 대비 ${rate.toFixed(1)}%</div><div class="cohort-funnel-track"><span class="cohort-funnel-fill" style="width:${Math.min(100, rate)}%;background:${step.color}"></span></div></div>`;
    }).join("")}</div><div class="cohort-funnel-note">조회 기간의 초진 중 21일 관찰 기간이 모두 끝난 ${eligible.toLocaleString()}명 기준 · 21일 평균 방문 ${Number(s.avgMatureFollowupVisits || 0).toFixed(1)}회 · 초진일부터 21일 안의 방문만 집계</div>`;
  }

  function renderSummaryBreakdown(title, total, unit, items, highlight = null, displayDivisor = 1) {
    const safeTotal = Math.max(0, Number(total || 0));
    const segments = items.map(item => {
      const value = Math.max(0, Number(item.value || 0));
      const percent = safeTotal ? (value / safeTotal) * 100 : 0;
      return { ...item, value, percent };
    });
    const displayed = value => Math.round(Number(value || 0) / Math.max(1, Number(displayDivisor || 1))).toLocaleString();
    return `<div class="summary-breakdown">
      <div class="summary-breakdown-head"><div class="summary-breakdown-title">${escapeHtml(title)}</div><div class="summary-breakdown-total">${highlight ? `${escapeHtml(highlight.label)} ${displayed(highlight.value)}${escapeHtml(unit)} · ${safeTotal ? ((Number(highlight.value || 0) / safeTotal) * 100).toFixed(1) : "0.0"}%` : `총 ${displayed(safeTotal)}${escapeHtml(unit)}`}</div></div>
      <div class="summary-stacked-bar" role="img" aria-label="${escapeHtml(title)} 구성">
        ${segments.map(item => `<span class="summary-stacked-segment" style="width:${item.percent}%;background:${item.color}" title="${escapeHtml(item.label)} ${displayed(item.value)}${escapeHtml(unit)} (${item.percent.toFixed(1)}%)"></span>`).join("")}
      </div>
      <div class="summary-breakdown-legend">
        ${segments.map(item => `<div class="summary-breakdown-item"><div class="summary-breakdown-label"><span class="summary-breakdown-dot" style="background:${item.color}"></span>${escapeHtml(item.label)}</div><div class="summary-breakdown-value">${displayed(item.value)}${escapeHtml(unit)} · ${item.percent.toFixed(1)}%</div></div>`).join("")}
      </div>
    </div>`;
  }

  function renderTreatmentUtilizationPanel(title, total, items, highlight) {
    const safeTotal = Math.max(0, Number(total || 0));
    const segments = items.map(item => {
      const value = Math.max(0, Number(item.value || 0));
      return { ...item, value, percent: safeTotal ? value / safeTotal * 100 : 0 };
    });
    const highlightValue = Number(highlight?.value || 0);
    return `<div class="treatment-utilization-panel">
      <div class="summary-breakdown-head"><div class="summary-breakdown-title">${escapeHtml(title)}</div><div class="summary-breakdown-total">${highlightValue.toLocaleString()}명 · ${safeTotal ? (highlightValue / safeTotal * 100).toFixed(1) : "0.0"}%</div></div>
      <div class="summary-stacked-bar" role="img" aria-label="${escapeHtml(title)} 이용률">
        ${segments.map(item => `<span class="summary-stacked-segment" style="width:${item.percent}%;background:${item.color}" title="${escapeHtml(item.label)} ${item.value.toLocaleString()}명 (${item.percent.toFixed(1)}%)"></span>`).join("")}
      </div>
      <div class="summary-breakdown-legend">${segments.map(item => `<div class="summary-breakdown-item"><div class="summary-breakdown-label"><span class="summary-breakdown-dot" style="background:${item.color}"></span>${escapeHtml(item.label)}</div><div class="summary-breakdown-value">${item.value.toLocaleString()}명 · ${item.percent.toFixed(1)}%</div></div>`).join("")}</div>
    </div>`;
  }

  function renderTreatmentUtilization(clinicPatients, chunaItems, chunaPatients, pharmaItems, pharmaPatients) {
    return `<div class="summary-breakdown wide-card"><div class="summary-breakdown-head"><div class="summary-breakdown-title">치료 이용률</div><div class="summary-breakdown-total">진료 환자 ${Number(clinicPatients || 0).toLocaleString()}명 기준</div></div><div class="treatment-utilization-grid">
      ${renderTreatmentUtilizationPanel("추나", clinicPatients, chunaItems, { value: chunaPatients })}
      ${renderTreatmentUtilizationPanel("약침", clinicPatients, pharmaItems, { value: pharmaPatients })}
    </div><div class="cohort-funnel-note">추나와 약침은 같은 환자가 모두 이용할 수 있으므로 각각 독립된 비율입니다.</div></div>`;
  }

  function renderSummaryBreakdowns(s) {
    const prescriptionOnlyPatients = Number(s.prescriptionOnlyPatients ?? s.prescriptionPatients ?? 0);
    const newUniquePatients = Number(s.newUniquePatients ?? s.newPatients ?? 0);
    const revisitUniquePatients = Math.max(0, Number(s.uniquePatients || 0) - newUniquePatients);
    const totalPatients = Number(s.totalPatients || 0);
    const clinicPatients = Number(s.uniquePatients || 0);
    const complexChunaPatients = Math.min(clinicPatients, Number(s.complexChunaPatients || 0));
    const simpleChunaPatients = Math.max(0, Math.min(clinicPatients - complexChunaPatients, Number(s.simpleOnlyChunaPatients ?? (Number(s.chunaPatients || 0) - complexChunaPatients))));
    const regularChunaPatients = Math.max(0, clinicPatients - simpleChunaPatients - complexChunaPatients);
    const pharmaPatients = Math.min(clinicPatients, Number(s.pharmaPatients || 0));
    const regularPharmaPatients = Math.max(0, clinicPatients - pharmaPatients);
    const pharmaPatientTypeCounts = s.pharmaPatientTypeCounts || {};
    const pharmaTypeColors = { "약침1": "#22c55e", "약침2": "#39a9f5", "약침3": "#a78bfa", "약침4": "#f97316", "약침L": "#eab308", "약침자": "#fb7185", "약침 2종 이상": "#ef4444" };
    const pharmaTypeItems = ["약침1", "약침2", "약침3", "약침4", "약침L", "약침자", "약침 2종 이상"]
      .map(label => ({ label, value: Number(pharmaPatientTypeCounts[label] || 0), color: pharmaTypeColors[label] }))
      .filter(item => item.value > 0);
    $("summaryBreakdowns").innerHTML = [
      renderSummaryBreakdown("진료비 구성", Number(s.financialTotals?.claimAmount || 0) + Number(s.financialTotals?.insuredCopay || 0) + Number(s.financialTotals?.nonCoveredAmount || 0), "만원", [
        { label: "보험 청구", value: Number(s.financialTotals?.claimAmount || 0), color: "#39a9f5" },
        { label: "본인부담", value: Number(s.financialTotals?.insuredCopay || 0), color: "#ffca6a" },
        { label: "비급여", value: Number(s.financialTotals?.nonCoveredAmount || 0), color: "#a78bfa" }
      ], null, 10000),
      renderSummaryBreakdown("총 환자 수 구성", s.totalPatients, "명", [
        { label: "약환", value: prescriptionOnlyPatients, color: "#a78bfa" },
        { label: "초진", value: newUniquePatients, color: "#ffca6a" },
        { label: "기존 환자", value: revisitUniquePatients, color: "#39a9f5" }
      ]),
      renderTreatmentUtilization(clinicPatients, [
        { label: "일반 환자", value: regularChunaPatients, color: "#64748b" },
        { label: "단순추나 환자", value: simpleChunaPatients, color: "#39a9f5" },
        { label: "복합추나 환자", value: complexChunaPatients, color: "#fb7185" }
      ], simpleChunaPatients + complexChunaPatients, [
        { label: "일반 환자", value: regularPharmaPatients, color: "#64748b" },
        ...(pharmaTypeItems.length ? pharmaTypeItems : [{ label: "약침 환자", value: pharmaPatients, color: "#22c55e" }])
      ], pharmaPatients)
    ].join("");
  }

  function formatStatValue(value, decimals = 0) {
    const number = Number(value || 0);
    return decimals > 0
      ? number.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
      : number.toLocaleString();
  }

  function renderCountTable(wrapId, counts, { gold = false, limit = 0, expandable = false, order = null, valueHeader = "건수", decimals = 0 } = {}) {
    const entries = order
      ? order.map(name => [name, counts[name] || 0]).filter(([, count]) => count > 0)
      : Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const wrap = $(wrapId);
    if (!entries.length) { wrap.innerHTML = `<div class="empty">데이터 없음</div>`; return; }
    const canExpand = expandable && limit > 0 && entries.length > limit;
    const draw = expanded => {
      const rows = limit && !expanded ? entries.slice(0, limit) : entries;
      const max = Math.max(1, ...rows.map(([, count]) => Number(count) || 0));
      wrap.innerHTML = `
        <table>
          <thead><tr><th>항목</th><th class="num">${valueHeader}</th><th class="bar-cell"></th></tr></thead>
          <tbody>
            ${rows.map(([name, count]) => `
              <tr${gold && name.includes("약침") ? ' class="highlight"' : ""}>
                <td>${escapeHtml(name)}</td>
                <td class="num">${formatStatValue(count, decimals)}</td>
                <td class="bar-cell"><div class="bar${gold && name.includes("약침") ? " gold" : ""}" style="width:${Math.round((count / max) * 100)}%"></div></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        ${canExpand ? `<div class="table-expand-row"><button class="table-expand-btn" type="button">${expanded ? "접기" : `전체 ${entries.length}개 펼치기`}</button></div>` : ""}
      `;
      if (canExpand) wrap.querySelector(".table-expand-btn").addEventListener("click", () => draw(!expanded));
    };
    draw(false);
  }

  function money(value) {
    return `${Math.round(Number(value || 0)).toLocaleString()}원`;
  }

  function moneyInTenThousands(value) {
    return `${Math.round(Number(value || 0) / 10000).toLocaleString()}만원`;
  }

  function renderRetentionTable(wrapId, rows = [], { doctor = false, diagnosisNames = {} } = {}) {
    const wrap = $(wrapId);
    if (!rows.length) { wrap.innerHTML = `<div class="empty">데이터 없음</div>`; return; }
    wrap.innerHTML = `<div class="table-scroll"><table><thead><tr><th>${doctor ? "원장" : "구분"}</th>${doctor ? "<th class=\"num\">진료</th>" : ""}<th class="num">초진</th><th class="num">재진율</th><th class="num">삼진율</th></tr></thead><tbody>${rows.slice(0, 15).map(row => {
      const label = diagnosisNames[row.name] ? `${row.name} · ${diagnosisNames[row.name]}` : row.name;
      return `<tr><td>${escapeHtml(label)}</td>${doctor ? `<td class="num">${Number(row.visits || 0).toLocaleString()}</td>` : ""}<td class="num">${Number(row.eligible || 0).toLocaleString()}</td><td class="num">${(Number(row.returnRate || 0) * 100).toFixed(1)}%</td><td class="num">${(Number(row.thirdVisitRate || 0) * 100).toFixed(1)}%</td></tr>`;
    }).join("")}</tbody></table></div>`;
  }

  function renderTreatmentConversionTable(rows = []) {
    const wrap = $("treatmentRetentionWrap");
    if (!rows.length) { wrap.innerHTML = `<div class="empty">데이터 없음</div>`; return; }
    wrap.innerHTML = `<div class="table-scroll"><table><thead><tr><th>초진 치료</th><th class="num">초진</th><th class="num">재진 도달</th><th class="num">재진율</th><th class="num">삼진 도달</th><th class="num">삼진율</th></tr></thead><tbody>${rows.map(row => {
      const initial = Number(row.eligible || 0);
      const lowSample = initial > 0 && initial < 10;
      return `<tr><td>${escapeHtml(row.name)}</td><td class="num">${initial.toLocaleString()}${lowSample ? ` <span class="low-sample">표본 적음</span>` : ""}</td><td class="num">${Number(row.returning || 0).toLocaleString()}</td><td class="num">${(Number(row.returnRate || 0) * 100).toFixed(1)}%</td><td class="num">${Number(row.third || 0).toLocaleString()}</td><td class="num">${(Number(row.thirdVisitRate || 0) * 100).toFixed(1)}%</td></tr>`;
    }).join("")}</tbody></table></div><div class="cohort-funnel-note">21일 추적이 끝난 초진 코호트의 초진 당일 치료 기준 · 초진일부터 21일 안의 재진·삼진 도달 인원 · 초진 10명 미만은 표본 적음 표시</div>`;
  }

  function renderDoctorDataTable(rows = [], financials = {}) {
    const wrap = $("doctorRetentionWrap");
    const names = [...new Set([...rows.map(row => row.name), ...Object.keys(financials || {})])];
    const retentionByName = Object.fromEntries(rows.map(row => [row.name, row]));
    const combinedRows = names.map(name => ({ name, ...(retentionByName[name] || {}), ...(financials[name] || {}) }))
      .sort((a, b) => Number(b.visits || 0) - Number(a.visits || 0));
    if (!combinedRows.length) { wrap.innerHTML = `<div class="empty">데이터 없음</div>`; return; }
    wrap.innerHTML = `<div class="table-scroll"><table><thead><tr><th>원장</th><th class="num">진료</th><th class="num">일평균 환자</th><th class="num">환자당 방문</th><th class="num">초진</th><th class="num">재진율</th><th class="num">삼진율</th><th class="num">급여 진료비 총액</th><th class="num">비급여 총액</th><th class="num">비급여 비율</th><th class="num">1건 평균</th></tr></thead><tbody>${combinedRows.map(row => {
      const combined = Number(row.totalFee || 0) + Number(row.nonCoveredAmount || 0);
      const lowSample = Number(row.eligible || 0) < 10;
      const nonCoveredRate = combined ? Number(row.nonCoveredAmount || 0) / combined : 0;
      return `<tr><td>${escapeHtml(row.name)}${lowSample ? ` <span class="low-sample">표본 적음</span>` : ""}</td><td class="num">${Number(row.visits || 0).toLocaleString()}</td><td class="num">${Number(row.avgVisitsPerDay || 0).toFixed(1)}</td><td class="num">${Number(row.avgVisitsPerPatient || 0).toFixed(1)}회</td><td class="num">${Number(row.eligible || 0).toLocaleString()}</td><td class="num">${(Number(row.returnRate || 0) * 100).toFixed(1)}%</td><td class="num">${(Number(row.thirdVisitRate || 0) * 100).toFixed(1)}%</td><td class="num">${moneyInTenThousands(row.totalFee)}</td><td class="num">${moneyInTenThousands(row.nonCoveredAmount)}</td><td class="num">${(nonCoveredRate * 100).toFixed(1)}%</td><td class="num">${money(row.coveredVisits ? combined / row.coveredVisits : 0)}</td></tr>`;
    }).join("")}</tbody></table></div><div class="cohort-funnel-note">일평균 환자는 해당 원장의 진료 건수 ÷ 진료일 · 환자당 방문은 진료 건수 ÷ 실환자 수 · 초진 10명 미만은 표본 적음 표시</div>`;
  }

  function renderSimpleBarChart(wrapId, rows = [], { value = row => row.value, label = row => row.label, formatter = n => Number(n).toLocaleString(), color = "#39a9f5" } = {}) {
    const wrap = $(wrapId);
    if (!rows.length) { wrap.innerHTML = `<div class="empty">데이터 없음</div>`; return; }
    const max = Math.max(1, ...rows.map(value));
    wrap.innerHTML = `<table><tbody>${rows.map(row => `<tr><td style="width:32%">${escapeHtml(label(row))}</td><td class="num" style="width:22%">${escapeHtml(formatter(value(row)))}</td><td class="bar-cell"><div class="bar" style="background:${color};width:${Math.round(value(row) / max * 100)}%"></div></td></tr>`).join("")}</tbody></table>`;
  }

  function renderFinancialStats(s = {}, previous = {}) {
    const totals = s.financialTotals || {};
    const coverage = s.financialCoverage || {};
    const previousTotals = previous.financialTotals || {};
    const previousCoverage = previous.financialCoverage || {};
    const covered = Number(coverage.totalFee || 0);
    const visits = Number(s.visits || 0);
    const coverageRate = visits ? covered / visits : 0;
    $("financialCoverageText").textContent = `금액 데이터 보유 ${covered.toLocaleString()} / ${visits.toLocaleString()}건 (${(coverageRate * 100).toFixed(1)}%) · 평균은 금액이 있는 진료만 기준`;
    const totalFee = Number(totals.totalFee || 0);
    const noncovered = Number(totals.nonCoveredAmount || 0);
    const previousTotalFee = Number(previousTotals.totalFee || 0);
    const combinedTotalFee = totalFee + noncovered;
    const previousCombinedTotalFee = previousTotalFee + Number(previousTotals.nonCoveredAmount || 0);
    const previousCovered = Number(previousCoverage.totalFee || 0);
    const currentDays = Math.max(1, Number(s.clinicDays || 0));
    const previousDays = Math.max(1, Number(previous.clinicDays || 0));
    const totalCard = (label, value, previousValue, color = '') => `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value metric-total-average financial-total-value ${color}"><span>${moneyInTenThousands(value)}</span><span class="metric-average">/ ${moneyInTenThousands(value / currentDays)}</span></div><div class="metric-sub">만원이하반올림</div>${summaryComparison(value / currentDays / 10000, previousValue / previousDays / 10000, { suffix: "만원" })}</div>`;
    const currentNoncoveredRate = combinedTotalFee ? noncovered / combinedTotalFee : 0;
    const previousNoncoveredRate = previousCombinedTotalFee ? Number(previousTotals.nonCoveredAmount || 0) / previousCombinedTotalFee : 0;
    const currentPerVisit = covered ? totalFee / covered : 0;
    const previousPerVisit = previousCovered ? previousTotalFee / previousCovered : 0;
    const noncoveredVisits = Number(coverage.nonCoveredAmount || 0);
    const previousNoncoveredVisits = Number(previousCoverage.nonCoveredAmount || 0);
    const currentNoncoveredPerVisit = noncoveredVisits ? noncovered / noncoveredVisits : 0;
    const previousNoncoveredPerVisit = previousNoncoveredVisits ? Number(previousTotals.nonCoveredAmount || 0) / previousNoncoveredVisits : 0;
    const currentCombinedPerVisit = covered ? combinedTotalFee / covered : 0;
    const previousCombinedPerVisit = previousCovered ? previousCombinedTotalFee / previousCovered : 0;
    const currentPerPatient = Number(s.totalPatients || 0) ? combinedTotalFee / Number(s.totalPatients || 0) : 0;
    const previousPerPatient = Number(previous.totalPatients || 0) ? previousCombinedTotalFee / Number(previous.totalPatients || 0) : 0;
    $("summaryMetrics").insertAdjacentHTML("beforeend", [

  function renderDiagnosisStats(s = {}) {
    const diagnoses = Object.values(s.diagnosisCounts || {}).sort((a, b) => b.count - a.count);

    const visits = Number(s.visits || 0);
    $("diagnosisCoverageText").textContent = `상병코드 데이터 보유 ${covered.toLocaleString()} / ${visits.toLocaleString()}건 (${(visits ? covered / visits * 100 : 0).toFixed(1)}%)`;
    const retentionByCode = Object.fromEntries((s.diagnosisRetention || []).map(row => [row.name, row]));
    const initialCounts = s.initialDiagnosisCounts || {};
    const detailRows = diagnoses.map(row => {
      const retention = retentionByCode[row.code] || {};
      return { ...retention, ...row, initial: Number(initialCounts[row.code] ?? retention.eligible ?? 0) };
    });
    const groupCodeOf = code => String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3) || "기타";
    const groupMap = new Map();
    detailRows.forEach(row => {
      const groupCode = groupCodeOf(row.code);
      if (!groupMap.has(groupCode)) groupMap.set(groupCode, { code: groupCode, count: 0, initial: 0, eligible: 0, returning: 0, third: 0, details: [] });
      const group = groupMap.get(groupCode);
      group.count += Number(row.count || 0);
      group.initial += Number(row.initial || 0);
      group.eligible += Number(row.eligible ?? row.initial ?? 0);
      group.returning += Number(row.returning || 0);
      group.third += Number(row.third || 0);
      group.details.push(row);
    });
    const groups = [...groupMap.values()].map(group => {
      group.details.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
      const representative = group.details[0] || {};
      return { ...group, representativeName: representative.name || "-", returnRate: group.eligible ? group.returning / group.eligible : 0, thirdVisitRate: group.eligible ? group.third / group.eligible : 0 };
    }).sort((a, b) => b.count - a.count || a.code.localeCompare(b.code));

    const rateCell = (initial, rate) => Number(initial || 0) ? `${(Number(rate || 0) * 100).toFixed(1)}%` : "-";

          return `<tr class="diagnosis-detail-row hidden" data-diagnosis-group="${escapeHtml(group.code)}"><td class="diagnosis-detail-code">${escapeHtml(row.code)}</td><td>${escapeHtml(row.name || "-")}</td><td class="num">${Number(row.count || 0).toLocaleString()}</td><td class="num">${(covered ? Number(row.count || 0) / covered * 100 : 0).toFixed(1)}%</td><td class="num">${initial.toLocaleString()}${detailLowSample ? ` <span class="low-sample">표본 적음</span>` : ""}</td><td class="num">${rateCell(initial, row.returnRate)}</td><td class="num">${rateCell(initial, row.thirdVisitRate)}</td></tr>`;
        }).join("");
        return `<tr class="diagnosis-group-row"><td><div class="diagnosis-group-code"><button type="button" class="diagnosis-toggle" data-diagnosis-toggle="${escapeHtml(group.code)}" aria-expanded="false">＋</button>${escapeHtml(group.code)}</div></td><td>${escapeHtml(group.representativeName)}</td><td class="num">${group.count.toLocaleString()}</td><td class="num">${(covered ? group.count / covered * 100 : 0).toFixed(1)}%</td><td class="num">${group.initial.toLocaleString()}${lowSample ? ` <span class="low-sample">표본 적음</span>` : ""}</td><td class="num">${rateCell(group.initial, group.returnRate)}</td><td class="num">${rateCell(group.initial, group.thirdVisitRate)}</td></tr>${detailHtml}`;
      }).join("")}</tbody></table></div>${groups.length > 15 ? `<div class="table-expand-row"><button type="button" class="table-expand-btn" id="diagnosisExpandBtn">${expanded ? "상위 15개군만 보기" : `전체 ${groups.length.toLocaleString()}개군 펼치기`}</button></div>` : ""}<div class="cohort-funnel-note">상병코드 앞 3자리 기준 · 대표 상병명은 그룹 내 진료 건수가 가장 많은 상세 상병 · 재진·삼진율은 환자 수를 합산해 재계산 · ＋ 버튼으로 상세 코드 확인 · 초진 10명 미만은 표본 적음 표시</div>`;
      const button = $("diagnosisExpandBtn");
      if (button) button.addEventListener("click", () => draw(!expanded));
      wrap.querySelectorAll("[data-diagnosis-toggle]").forEach(toggle => toggle.addEventListener("click", () => {
        const code = toggle.dataset.diagnosisToggle;
        const open = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(open));
        toggle.textContent = open ? "－" : "＋";
        wrap.querySelectorAll(`[data-diagnosis-group="${code}"]`).forEach(row => row.classList.toggle("hidden", !open));
      }));

  function renderHourlyPatientHeatmap(stats = {}, unknownCount = 0, weekdayAverages = {}) {
    const wrap = $("hourlyPatientChartWrap");
    if (!wrap) return;
    const counts = stats.counts || {};
    const clinicDays = stats.clinicDays || {};
    const days = ["월", "화", "수", "목", "금", "토"];
    const hours = Array.from({ length: 10 }, (_, index) => index + 9);
    const isActive = (day, hour) => day !== "토" || hour <= 14;
    const knownTotal = days.reduce((total, day) => total + hours.reduce((sum, hour) => sum + (isActive(day, hour) ? Number(counts[day]?.[String(hour).padStart(2, "0")] || 0) : 0), 0), 0);
    const subtitle = $("hourlyPatientSubtitle");
    if (subtitle) subtitle.textContent = `셀: 해당 요일 진료일당 평균 환자 수 · 평일 09:00~18:30 · 토요일 09:00~14:30 · 시간 확인 방문 ${knownTotal.toLocaleString()}건${unknownCount ? ` · 시간 정보 없는 방문 ${Number(unknownCount).toLocaleString()}건 제외` : ""}`;
    if (!knownTotal) {
      wrap.innerHTML = `<div class="empty">선택 기간에 시간 정보가 저장된 평일·토요일 방문이 없습니다.</div>`;
      return;
    }
    const averages = days.flatMap(day => hours.filter(hour => isActive(day, hour)).map(hour => Number(counts[day]?.[String(hour).padStart(2, "0")] || 0) / Math.max(1, Number(clinicDays[day] || 0))));
    const maxAverage = Math.max(1, ...averages);
    const colorFor = value => `rgba(57,169,245,${(0.08 + Math.min(1, value / maxAverage) * 0.82).toFixed(2)})`;
    const hourAverage = hour => {
      const activeDays = days.filter(day => isActive(day, hour));
      const total = activeDays.reduce((sum, day) => sum + Number(counts[day]?.[String(hour).padStart(2, "0")] || 0), 0);
      const dates = activeDays.reduce((sum, day) => sum + Number(clinicDays[day] || 0), 0);
      return dates ? total / dates : 0;
    };
    wrap.innerHTML = `<div class="heatmap-scroll"><div class="heatmap-grid">
      <div class="heatmap-head"></div>${hours.map(hour => `<div class="heatmap-head">${String(hour).padStart(2, "0")}시</div>`).join("")}<div class="heatmap-head">요일 평균</div>
      ${days.map(day => {
        const dayCount = hours.reduce((sum, hour) => sum + (isActive(day, hour) ? Number(counts[day]?.[String(hour).padStart(2, "0")] || 0) : 0), 0);
        const dayCountDates = Number(clinicDays[day] || 0);
        const dayAverage = Number(weekdayAverages[day] ?? (dayCountDates ? dayCount / dayCountDates : 0));
        return `<div class="heatmap-row-label">${day}</div>${hours.map(hour => {
          if (!isActive(day, hour)) return `<div class="heatmap-cell disabled">—</div>`;
          const key = String(hour).padStart(2, "0"), count = Number(counts[day]?.[key] || 0), average = dayCountDates ? count / dayCountDates : 0;
          const to = day === "토" && hour === 14 ? "14:30" : `${String(hour + 1).padStart(2, "0")}:00`;
          return `<div class="heatmap-cell" style="background:${colorFor(average)}" title="${day}요일 ${key}:00~${to} · 일평균 ${average.toFixed(1)}명 · 실제 ${count.toLocaleString()}건 / ${dayCountDates}일">${average.toFixed(1)}</div>`;
        }).join("")}<div class="heatmap-total" title="${day}요일 전체 진료 기준 · 일평균 ${dayAverage.toFixed(1)}건 / ${dayCountDates}일">${dayAverage.toFixed(1)}</div>`;
      }).join("")}
      <div class="heatmap-row-label heatmap-bottom-label">시간 평균</div>${hours.map(hour => `<div class="heatmap-total">${hourAverage(hour).toFixed(1)}</div>`).join("")}<div class="heatmap-total">—</div>
    </div></div>`;
  }

  function chartMetricValue(row, metric) {
    if (!row || row[metric.key] === null || row[metric.key] === undefined) return null;
    return Number(row[metric.key] || 0);
  }

  function trendPeriodEnd(key, unit) {
    const text = String(key || "");
    if (unit === "day" && /^\d{8}$/.test(text)) return `${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6, 8)}`;
    if (unit === "month" && /^\d{6}$/.test(text)) return ymd(new Date(Number(text.slice(0, 4)), Number(text.slice(4, 6)), 0));
    if (unit === "quarter" && /^\d{4}Q[1-4]$/.test(text)) return ymd(new Date(Number(text.slice(0, 4)), Number(text.slice(5, 6)) * 3, 0));
    if (unit === "year" && /^\d{4}$/.test(text)) return `${text}-12-31`;
    if (unit === "week" && /^\d{6}$/.test(text)) {
      const year = Number(text.slice(0, 4));
      const week = Number(text.slice(4, 6));
      const jan4 = new Date(year, 0, 4);
      const week1Monday = new Date(jan4);
      week1Monday.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
      week1Monday.setDate(week1Monday.getDate() + (week - 1) * 7 + 6);
      return ymd(week1Monday);
    }
    return "";
  }

  function markRecentFollowupRates(rows = [], chartUnit = "week", cutoff = "") {
    return rows.map(row => {
      const periodEnd = trendPeriodEnd(row.key, chartUnit);
      return { ...row, followupRecent: Boolean(periodEnd && periodEnd > cutoff) };
    });
  }

  function isFollowupRateMetric(metric) {
    return metric.key === "returnRate" || metric.key === "thirdVisitRate";
  }

  function followupSegmentRows(rows, metric, recentSegment) {
    if (!isFollowupRateMetric(metric)) return rows;
    const firstRecentIndex = rows.findIndex(row => row.followupRecent);
    return rows.map((row, idx) => {
      const keep = recentSegment
        ? firstRecentIndex >= 0 && idx >= Math.max(0, firstRecentIndex - 1)
        : !row.followupRecent;
      return keep ? row : { ...row, [metric.key]: null };
    });
  }

  function chartLinePath(rows, metric, yFn, xFn) {
    let drawing = false;
    return rows.map((row, idx) => {
      const value = chartMetricValue(row, metric);
      if (value === null) {
        drawing = false;
        return "";
      }
      const command = drawing ? "L" : "M";
      drawing = true;
      return `${command} ${xFn(idx).toFixed(1)} ${yFn(value).toFixed(1)}`;
    }).filter(Boolean).join(" ");
  }

  function renderWeeklyChart(rows, chartUnit = "week") {
    const wrap = $("weeklyChartWrap");
    if (!rows.length) {
      wrap.innerHTML = `<div class="empty">데이터 없음</div>`;
      return;
    }

    const width = Math.max(720, rows.length * 78 + 120);
    const height = 340;
    const pad = { top: 24, right: 118, bottom: 58, left: 58 };
    const chartW = width - pad.left - pad.right;
    const chartH = height - pad.top - pad.bottom;
    const visibleMetricKeys = new Set(getVisibleChartMetricKeys());
    const visibleMetrics = CHART_METRICS.filter(metric => visibleMetricKeys.has(metric.key));
    if (!visibleMetrics.length) {
      wrap.innerHTML = `<div class="empty">표시할 그래프 항목을 선택하세요</div>`;
      return;
    }
    const countMetrics = visibleMetrics.filter(metric => metric.axis === "count");
    const rateMetrics = visibleMetrics.filter(metric => metric.axis === "rate");
    const moneyMetrics = visibleMetrics.filter(metric => metric.axis === "money");
    const maxCount = Math.max(1, ...rows.map(row => Math.max(0, ...countMetrics.map(metric => Number(row[metric.key] || 0)))));
    const countTop = Math.ceil(maxCount * 1.15);
    const maxRate = Math.max(0.1, ...rows.map(row => Math.max(0, ...rateMetrics.map(metric => chartMetricValue(row, metric) ?? 0))));
    const rateTop = Math.min(1, Math.max(0.1, Math.ceil(maxRate * 10) / 10));
    const maxMoney = Math.max(1, ...rows.map(row => Math.max(0, ...moneyMetrics.map(metric => chartMetricValue(row, metric) ?? 0))));
    const moneyTop = Math.max(1, Math.ceil(maxMoney / 10000) * 10000);
    const x = idx => pad.left + (rows.length === 1 ? chartW / 2 : (chartW * idx) / (rows.length - 1));
    const yCount = value => pad.top + chartH - (value / countTop) * chartH;
    const yRate = value => pad.top + chartH - (value / rateTop) * chartH;
    const yMoney = value => pad.top + chartH - (value / moneyTop) * chartH;
    const countTicks = [0, 0.25, 0.5, 0.75, 1].map(p => countTop * p);
    const rateTicks = [0, 0.25, 0.5, 0.75, 1].map(p => rateTop * p);
    const moneyTicks = [0, 0.25, 0.5, 0.75, 1].map(p => moneyTop * p);
    const unitLabel = { day: "일", week: "주차", month: "월", quarter: "분기", year: "년" }[chartUnit] || "기간";
    const xLabel = row => chartUnit === "week"
      ? `<text class="chart-text" x="${x(row.idx)}" y="${height - pad.bottom + 20}" text-anchor="middle">${row.key}</text><text class="chart-text" x="${x(row.idx)}" y="${height - pad.bottom + 36}" text-anchor="middle">${isoWeekRangeLabel(row.key)}</text>`
      : `<text class="chart-text" x="${x(row.idx)}" y="${height - pad.bottom + 22}" text-anchor="middle">${row.key}</text>`;

    wrap.innerHTML = `

          ${countTicks.map(t => {
            const y = yCount(t);
            return `
              <line class="chart-grid" x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}"></line>
              <text class="chart-text" x="${pad.left - 10}" y="${y + 4}" text-anchor="end">${t.toFixed(t < 10 ? 1 : 0)}</text>
            `;
          }).join("")}
          ${rateMetrics.length ? rateTicks.map(t => {
            const y = yRate(t);
            return `<text class="chart-text" x="${width - pad.right + 10}" y="${y + 4}">${Math.round(t * 100)}%</text>`;
          }).join("") : ""}
          ${moneyMetrics.length ? moneyTicks.map(t => {
            const y = yMoney(t);
            return `<text class="chart-text" x="${width - pad.right + (rateMetrics.length ? 50 : 10)}" y="${y + 4}">${Math.round(t / 10000).toLocaleString()}만</text>`;
          }).join("") : ""}
          <line class="chart-axis" x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}"></line>
          ${rateMetrics.length ? `<line class="chart-axis" x1="${width - pad.right}" y1="${pad.top}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>` : ""}
          ${moneyMetrics.length && !rateMetrics.length ? `<line class="chart-axis" x1="${width - pad.right}" y1="${pad.top}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>` : ""}
          <line class="chart-axis" x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>
          ${countMetrics.length ? `<text class="chart-text" x="${pad.left}" y="14">일평균 인원</text>` : ""}
          ${rateMetrics.length ? `<text class="chart-text" x="${width - pad.right}" y="14" text-anchor="end">비율</text>` : ""}
          ${moneyMetrics.length ? `<text class="chart-text" x="${width - pad.right + (rateMetrics.length ? 52 : 0)}" y="14" text-anchor="end">진료비</text>` : ""}
          ${visibleMetrics.map(metric => {

            if (!isFollowupRateMetric(metric)) return `<path class="chart-line" d="${chartLinePath(rows, metric, yFn, x)}" stroke="${metric.color}"></path>`;
            const solidPath = chartLinePath(followupSegmentRows(rows, metric, false), metric, yFn, x);
