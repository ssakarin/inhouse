    const countTop = Math.max(1, Math.ceil(maxReference * 1.2));
    const yCount = value => pad.top + chartH - (Number(value || 0) / countTop) * chartH;
    const yRate = value => pad.top + chartH - Number(value || 0) * chartH;
    const groupWidth = Math.min(54, Math.max(18, chartW / Math.max(1, rows.length) * 0.72));
    const barWidth = Math.max(5, groupWidth / 3 - 2);
    const labelFor = row => chartUnit === "week" ? isoWeekRangeLabel(row.key).replace(/[()]/g, "") : slotLabelForKey(row.key, chartUnit);
    const showLabels = rows.length <= 12;
    wrap.innerHTML = `<div class="chart-wrap"><svg class="weekly-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="선택 지표와 초진 코호트 재진 삼진율 막대 비교">
      ${[0, 0.25, 0.5, 0.75, 1].map(p => { const y = pad.top + chartH - p * chartH; return `<line class="chart-grid" x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}"></line><text class="chart-text" x="${width - pad.right + 10}" y="${y + 4}">${Math.round(p * 100)}%</text>`; }).join("")}
      <line class="chart-axis" x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}"></line>
      <line class="chart-axis" x1="${width - pad.right}" y1="${pad.top}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>
      <line class="chart-axis" x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>
      <text class="chart-text" x="${pad.left}" y="15">${reference.axis}</text><text class="chart-text" x="${width - pad.right}" y="15" text-anchor="end">재진·삼진율</text>
      <text class="chart-text" x="${pad.left - 10}" y="${pad.top + 4}" text-anchor="end">${countTop}</text><text class="chart-text" x="${pad.left - 10}" y="${height - pad.bottom + 4}" text-anchor="end">0</text>
      ${rows.map((row, idx) => {
        const referenceValue = reference.value(row);
        const returnRate = chartMetricValue(row, returnMetric) ?? 0;
        const thirdRate = chartMetricValue(row, thirdMetric) ?? 0;
        const values = [
          { value: referenceValue, y: yCount(referenceValue), color: reference.color, label: reference.format(referenceValue), recent: false },
          { value: returnRate, y: yRate(returnRate), color: returnMetric.color, label: `${(returnRate * 100).toFixed(1)}%`, recent: row.followupRecent },
          { value: thirdRate, y: yRate(thirdRate), color: thirdMetric.color, label: `${(thirdRate * 100).toFixed(1)}%`, recent: row.followupRecent }
        ];
        return `<g>${values.map((item, barIdx) => { const bx = x(idx) + (barIdx - 1) * (barWidth + 2) - barWidth / 2; return `<rect x="${bx}" y="${item.y}" width="${barWidth}" height="${height - pad.bottom - item.y}" rx="3" fill="${item.color}" class="${item.recent ? "cohort-rate-bar-recent" : ""}"${item.recent ? ` stroke="${item.color}"` : ""}><title>${row.key} ${barIdx === 0 ? reference.label : barIdx === 1 ? "재진율" : "삼진율"} ${item.label}${item.recent ? " (추적 진행 중)" : ""}</title></rect>${showLabels && barIdx > 0 ? `<text class="chart-text" x="${bx + barWidth / 2}" y="${Math.max(pad.top + 10, item.y - 5)}" text-anchor="middle">${item.label}</text>` : ""}`; }).join("")}<text class="chart-text" x="${x(idx)}" y="${height - pad.bottom + 22}" text-anchor="middle">${labelFor(row)}</text></g>`;
      }).join("")}
    </svg></div><div class="chart-legend"><span class="legend-item"><span class="legend-swatch" style="background:${reference.color}"></span>${reference.label}</span><span class="legend-item"><span class="legend-swatch" style="background:${returnMetric.color}"></span>재진율 (초진 코호트)</span><span class="legend-item"><span class="legend-swatch" style="background:${thirdMetric.color}"></span>삼진율 (초진 코호트)</span></div>`;
  }

  function renderOperationalTrendChart(rows, chartUnit = "week") {
    const wrap = $("weeklyChartWrap");
    const visibleKeys = new Set(getVisibleChartMetricKeys());
    const metrics = CHART_METRICS.filter(metric => visibleKeys.has(metric.key));
    if (!metrics.length || !rows.length) {
      wrap.innerHTML = `<div class="empty">표시할 운영 지표를 선택하세요.</div>`;
      return;
    }
    const countMetrics = metrics.filter(metric => metric.axis === "count");
    const rateMetrics = metrics.filter(metric => metric.axis === "rate");
    const moneyMetrics = metrics.filter(metric => metric.axis === "money");
    const width = Math.max(760, rows.length * 72 + 120);
    const pad = { left: 58, right: moneyMetrics.length && rateMetrics.length ? 108 : 68, bottom: 50 };
    const chartW = width - pad.left - pad.right;
    const x = idx => pad.left + (rows.length === 1 ? chartW / 2 : chartW * idx / (rows.length - 1));
    const xLabels = rows.map((row, idx) => {
      const axisLabel = chartUnit === "week" ? isoWeekRangeLabel(row.key).replace(/[()]/g, "") : slotLabelForKey(row.key, chartUnit);
      return `<text class="chart-text" x="${x(idx)}" y="324" text-anchor="middle">${axisLabel}</text>`;
    }).join("");
    const legend = `<div class="chart-legend">${metrics.map(metric => `<span class="legend-item"><span class="legend-swatch" style="background:${metric.color}"></span>${metric.label}${metric.axis === "rate" ? " (%)" : metric.axis === "money" ? ` (${metric.unitLabel || "원/일"})` : " (명)"}</span>`).join("")}${metrics.some(isFollowupRateMetric) ? `<span class="legend-item"><span class="legend-swatch" style="background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px)"></span>재진율·삼진율 최근 21일 점선</span>` : ""}</div>`;

    if (operationalTrendMode === "index") {
      const normalizedByMetric = new Map();
      const allIndexValues = [];
      metrics.forEach(metric => {
        const base = rows.map(row => chartMetricValue(row, metric)).find(value => value !== null && value !== 0) || 0;
        const normalized = rows.map(row => {
          const value = chartMetricValue(row, metric);
          const indexValue = base && value !== null ? (value / base) * 100 : null;
          if (indexValue !== null) allIndexValues.push(indexValue);
          return { ...row, [metric.key]: indexValue };
        });
        normalizedByMetric.set(metric.key, { base, rows: normalized });
      });
      const rawMin = Math.min(100, ...allIndexValues), rawMax = Math.max(100, ...allIndexValues);
      const minIndex = Math.max(0, Math.floor((rawMin * 0.9) / 10) * 10);
      const maxIndex = Math.max(minIndex + 20, Math.ceil((rawMax * 1.1) / 10) * 10);
      const panelTop = 24, panelH = 260;
      const y = value => panelTop + panelH - ((Number(value) - minIndex) / (maxIndex - minIndex)) * panelH;
      const svg = `<svg class="weekly-chart" viewBox="0 0 ${width} 340" role="img" aria-label="운영 지표 변화 비교">${[minIndex, (minIndex + maxIndex) / 2, maxIndex].map(value => `<line class="chart-grid" x1="${pad.left}" y1="${y(value)}" x2="${width - pad.right}" y2="${y(value)}"></line><text class="chart-text" x="${pad.left - 9}" y="${y(value) + 4}" text-anchor="end">${Math.round(value)}</text>`).join("")}<line x1="${pad.left}" y1="${y(100)}" x2="${width - pad.right}" y2="${y(100)}" stroke="rgba(255,202,106,0.65)" stroke-dasharray="4 5"></line><text class="chart-text" x="${pad.left}" y="15">변화 지수</text>${metrics.map(metric => { const item = normalizedByMetric.get(metric.key); const solidRows = isFollowupRateMetric(metric) ? followupSegmentRows(item.rows, metric, false) : item.rows; const recentRows = isFollowupRateMetric(metric) ? followupSegmentRows(item.rows, metric, true) : []; return `<path class="chart-line" d="${chartLinePath(solidRows, metric, y, x)}" stroke="${metric.color}"></path>${isFollowupRateMetric(metric) ? `<path class="chart-line chart-line-recent" d="${chartLinePath(recentRows, metric, y, x)}" stroke="${metric.color}"></path>` : ""}${item.rows.map((row, idx) => { const indexValue = chartMetricValue(row, metric); const actualValue = chartMetricValue(rows[idx], metric); if (indexValue === null || actualValue === null) return ""; const recent = isFollowupRateMetric(metric) && row.followupRecent; return `<circle class="chart-dot" cx="${x(idx)}" cy="${y(indexValue)}" r="3" fill="${metric.color}"><title>${row.key} ${metric.title(actualValue)} · 지수 ${indexValue.toFixed(1)}${recent ? " (최근 21일 · 추적 진행 중)" : ""}</title></circle>`; }).join("")}`; }).join("")}${xLabels}</svg>`;
      wrap.innerHTML = `<div class="chart-wrap">${svg}</div>${legend}`;
      return;
    }

    const panelTop = 28, panelH = 260, height = 340;
    const countValues = rows.flatMap(row => countMetrics.map(metric => chartMetricValue(row, metric) ?? 0));
    const rateValues = rows.flatMap(row => rateMetrics.map(metric => chartMetricValue(row, metric) ?? 0));
    const moneyValues = rows.flatMap(row => moneyMetrics.map(metric => chartMetricValue(row, metric) ?? 0));
    const countTop = Math.max(1, Math.ceil(Math.max(1, ...countValues) * 1.15));
    const rateTop = Math.min(1, Math.max(0.1, Math.ceil(Math.max(0.1, ...rateValues) * 10) / 10));
    const moneyTop = Math.max(10000, Math.ceil(Math.max(1, ...moneyValues) / 10000) * 10000);
    const yCount = value => panelTop + panelH - (Number(value || 0) / countTop) * panelH;
    const yRate = value => panelTop + panelH - (Number(value || 0) / rateTop) * panelH;
    const yMoney = value => panelTop + panelH - (Number(value || 0) / moneyTop) * panelH;
    const ticks = [0, .25, .5, .75, 1];
    const gridAndAxes = `${ticks.map(p => {
      const y = panelTop + panelH - p * panelH;
      const countValue = countTop * p;
      const rateValue = rateTop * p;
      const moneyValue = moneyTop * p;
      return `<line class="chart-grid" x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}"></line>${countMetrics.length ? `<text class="chart-text" x="${pad.left - 9}" y="${y + 4}" text-anchor="end">${countValue.toFixed(countValue < 10 ? 1 : 0)}</text>` : ""}${rateMetrics.length ? `<text class="chart-text" x="${width - pad.right + 9}" y="${y + 4}">${Math.round(rateValue * 100)}%</text>` : ""}${moneyMetrics.length ? `<text class="chart-text" x="${width - pad.right + (rateMetrics.length ? 50 : 9)}" y="${y + 4}">${Math.round(moneyValue / 10000)}만</text>` : ""}`;
    }).join("")}<line class="chart-axis" x1="${pad.left}" y1="${panelTop}" x2="${pad.left}" y2="${panelTop + panelH}"></line><line class="chart-axis" x1="${width - pad.right}" y1="${panelTop}" x2="${width - pad.right}" y2="${panelTop + panelH}"></line><line class="chart-axis" x1="${pad.left}" y1="${panelTop + panelH}" x2="${width - pad.right}" y2="${panelTop + panelH}"></line>${countMetrics.length ? `<text class="chart-text" x="${pad.left}" y="16">일평균 인원</text>` : ""}${rateMetrics.length ? `<text class="chart-text" x="${width - pad.right}" y="16" text-anchor="end">환자 비율</text>` : ""}${moneyMetrics.length ? `<text class="chart-text" x="${width - pad.right + (rateMetrics.length ? 52 : 0)}" y="16" text-anchor="end">진료비</text>` : ""}`;
    const series = metrics.map(metric => {
      const y = metric.axis === "rate" ? yRate : metric.axis === "money" ? yMoney : yCount;
      const solidRows = isFollowupRateMetric(metric) ? followupSegmentRows(rows, metric, false) : rows;
      const recentRows = isFollowupRateMetric(metric) ? followupSegmentRows(rows, metric, true) : [];
      return `<path class="chart-line" d="${chartLinePath(solidRows, metric, y, x)}" stroke="${metric.color}"></path>${isFollowupRateMetric(metric) ? `<path class="chart-line chart-line-recent" d="${chartLinePath(recentRows, metric, y, x)}" stroke="${metric.color}"></path>` : ""}${rows.map((row, idx) => {
        const value = chartMetricValue(row, metric);
        if (value === null) return "";
        const recent = isFollowupRateMetric(metric) && row.followupRecent;
        const valueLabel = metric.axis === "rate" ? `${(value * 100).toFixed(1)}%` : metric.axis === "money" ? `${Math.round(value / 10000)}만` : value.toFixed(1);
        return `<circle class="chart-dot" cx="${x(idx)}" cy="${y(value)}" r="3" fill="${metric.color}"><title>${row.key} ${metric.title(value)}${recent ? " (최근 21일 · 추적 진행 중)" : ""}</title></circle><text class="chart-value-label" x="${x(idx)}" y="${Math.max(panelTop + 10, y(value) - 7)}" text-anchor="middle" fill="${metric.color}">${valueLabel}</text>`;
      }).join("")}`;
    }).join("");
    const svg = `<svg class="weekly-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="운영 지표 좌우축 실제값 추이">${gridAndAxes}${series}${xLabels}</svg>`;
    wrap.innerHTML = `<div class="chart-wrap">${svg}</div>${legend}`;
  }

  function periodAverageValue(stats = {}, metric) {
    const clinicDays = Number(stats.clinicDays || 0);
    if (metric.key === "avgVisitsPerDay") return clinicDays ? Number(stats.coreVisits || 0) / clinicDays : 0;
    if (metric.key === "avgNewPatientsPerDay") return clinicDays ? Number(stats.newPatients || 0) / clinicDays : 0;
    if (metric.key === "avgPrescriptionPatientsPerDay") return clinicDays ? Number(stats.prescriptionPatients || 0) / clinicDays : 0;
    if (metric.key === "avgChunaPerDay") return Number(stats.avgChunaPerDay || 0);
    if (metric.key === "avgPharmaPatientsPerDay") return Number(stats.avgPharmaPatientsPerDay || 0);
    if (metric.key === "avgPharmaPackagePurchasePatientsPerDay") return clinicDays ? Number(stats.pharmaPackagePurchasePatients || 0) / clinicDays : 0;
    if (metric.key === "avgCombinedFeePerDay") return clinicDays ? (Number(stats.financialTotals?.totalFee || 0) + Number(stats.financialTotals?.nonCoveredAmount || 0)) / clinicDays : 0;
    if (metric.key === "avgCombinedFeePerVisit") {
      const coveredVisits = Number(stats.financialCoverage?.totalFee || 0);
      return coveredVisits ? (Number(stats.financialTotals?.totalFee || 0) + Number(stats.financialTotals?.nonCoveredAmount || 0)) / coveredVisits : 0;
    }
    if (metric.key === "avgTotalFeePerDay") return clinicDays ? Number(stats.financialTotals?.totalFee || 0) / clinicDays : 0;
    if (metric.key === "avgNonCoveredFeePerDay") return clinicDays ? Number(stats.financialTotals?.nonCoveredAmount || 0) / clinicDays : 0;
    return Number(stats[metric.key] || 0);
  }

  function periodComparisonRangeLabel(range, metric) {
    return `${range.start} ~ ${range.end}`;
  }

  function formatPeriodAverage(value, metric) {
    if (metric.axis === "rate") return `${(value * 100).toFixed(1)}%`;
    if (metric.key === "avgCombinedFeePerVisit") return `${Math.round(value).toLocaleString()}원`;
    if (metric.axis === "money") return `${Math.round(value / 10000).toLocaleString()}만원`;
    return `${value.toFixed(1)}명`;
  }

  function periodAverageChange(current, previous, metric) {
    const difference = current - previous;
    if (Math.abs(difference) < 1e-12) return { text: "－ 0.0%", className: "neutral" };
    if (metric.axis === "rate") return { text: `${difference > 0 ? "▲" : "▼"} ${Math.abs(difference * 100).toFixed(1)}%p`, className: difference > 0 ? "increase" : "decrease" };
    if (!previous) return { text: "－ 비교 불가", className: "neutral" };
    return { text: `${difference > 0 ? "▲" : "▼"} ${Math.abs((difference / previous) * 100).toFixed(1)}%`, className: difference > 0 ? "increase" : "decrease" };
  }

  function renderPeriodComparisonChart(comparison, chartUnit = "week") {
    const wrap = $("periodComparisonChartWrap");
    if (!wrap) return;
    if (!comparison) {
      wrap.innerHTML = `<div class="empty">비교할 기간 단위를 선택하세요.</div>`;
      return;
    }

    const visibleMetricKeys = getVisibleChartMetricKeys("periodComparisonMetricToggles", ".comparison-chart-metric-chip");
    const metricByKey = new Map(CHART_METRICS.map(metric => [metric.key, metric]));
    const visibleMetrics = visibleMetricKeys.map(key => metricByKey.get(key)).filter(Boolean);
    if (!visibleMetrics.length) {
      wrap.innerHTML = `<div class="empty">표시할 그래프 항목을 선택하세요.</div>`;
      return;
    }

    const hasYearAgo = Boolean(comparison.yearAgo && comparison.yearAgoStats);
    const currentRangeLabel = periodComparisonRangeLabel(comparison.current);
    const previousRangeLabel = periodComparisonRangeLabel(comparison.previous);
    const yearAgoRangeLabel = hasYearAgo ? periodComparisonRangeLabel(comparison.yearAgo) : "";
    wrap.innerHTML = `<div class="table-scroll"><table class="comparison-matrix"><thead><tr><th>지표</th><th class="num">현재<span class="comparison-matrix-range">${currentRangeLabel}</span></th><th class="num">직전<span class="comparison-matrix-range">${previousRangeLabel}</span></th><th class="num">직전 대비</th>${hasYearAgo ? `<th class="num">전년 동기<span class="comparison-matrix-range">${yearAgoRangeLabel}</span></th><th class="num">전년 대비</th>` : ""}</tr></thead><tbody>
      ${visibleMetrics.map(metric => {
        const previousValue = periodAverageValue(comparison.previousStats, metric);
        const yearAgoValue = hasYearAgo ? periodAverageValue(comparison.yearAgoStats, metric) : 0;
        const currentValue = periodAverageValue(comparison.currentStats, metric);
        const change = periodAverageChange(currentValue, previousValue, metric);
        const yearAgoChange = hasYearAgo ? periodAverageChange(currentValue, yearAgoValue, metric) : null;
        return `<tr><td class="comparison-matrix-metric">${escapeHtml(metric.label)}</td><td class="num">${formatPeriodAverage(currentValue, metric)}</td><td class="num">${formatPeriodAverage(previousValue, metric)}</td><td class="comparison-matrix-change ${change.className}">${change.text}</td>${hasYearAgo ? `<td class="num">${formatPeriodAverage(yearAgoValue, metric)}</td><td class="comparison-matrix-change ${yearAgoChange.className}">${yearAgoChange.text}</td>` : ""}</tr>`;
      }).join("")}
    </tbody></table></div><div class="cohort-funnel-note">재진율·삼진율은 최근 21일 초진을 포함하며 각 비교 기간 종료일까지 관찰한 값입니다.</div>`;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function disableAutocomplete(root = document) {
    root.querySelectorAll?.("input, textarea, select").forEach(el => {
      el.setAttribute("autocomplete", "off");
      el.setAttribute("autocorrect", "off");
      el.setAttribute("autocapitalize", "off");
      el.setAttribute("spellcheck", "false");
    });
  }

  // ── 동작 ────────────────────────────────────────────────────────
  function setPresetActive(preset) {
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.toggle("active", b.dataset.preset === preset));
  }

  function setComparisonUnit(unit) {
    comparisonUnit = unit;
    document.querySelectorAll(".comparison-unit-btn").forEach(button => {
      button.classList.toggle("active", button.dataset.comparisonUnit === unit);
    });
    $("comparisonMonthControls")?.classList.toggle("hidden", unit !== "month");
    $("comparisonQuarterControls")?.classList.toggle("hidden", unit !== "quarter");
  }

  function setComparisonGraphUnit(unit) {
    comparisonGraphUnit = unit || comparisonDetailUnit(comparisonUnit);
    if ($("comparisonGraphUnit")) $("comparisonGraphUnit").value = comparisonGraphUnit;
  }

  function fillQuarterOptions(anchorEnd) {
    const currentYear = new Date((anchorEnd || today()) + "T00:00:00").getFullYear();
    const options = [];
    for (let year = currentYear - 5; year <= currentYear + 1; year += 1) {
      for (let quarter = 1; quarter <= 4; quarter += 1) {
        const key = `${year}Q${quarter}`;
        options.push(`<option value="${key}">${quarterLabel(key)}</option>`);
      }
    }
    ["comparisonPreviousQuarter", "comparisonCurrentQuarter"].forEach(id => {
      const select = $(id);
      if (select && !select.options.length) select.innerHTML = options.join("");
    });
  }

  function setComparisonPeriodDefaults(anchorEnd, force = false) {
    const anchor = anchorEnd || addDays(today(), -1);
    const currentMonth = anchor.slice(0, 7);
    const previousMonth = addMonths(`${currentMonth}-01`, -1).slice(0, 7);
    if ($("comparisonCurrentMonth") && (force || !$("comparisonCurrentMonth").value)) $("comparisonCurrentMonth").value = currentMonth;
    if ($("comparisonPreviousMonth") && (force || !$("comparisonPreviousMonth").value)) $("comparisonPreviousMonth").value = previousMonth;

    fillQuarterOptions(anchor);
    const currentQuarter = quarterKeyForDate(anchor);
    const previousQuarter = quarterKeyForDate(addDays(periodBoundsFor(anchor, "quarter").start, -1));
    if ($("comparisonCurrentQuarter") && (force || !$("comparisonCurrentQuarter").value)) $("comparisonCurrentQuarter").value = currentQuarter;
    if ($("comparisonPreviousQuarter") && (force || !$("comparisonPreviousQuarter").value)) $("comparisonPreviousQuarter").value = previousQuarter;
  }

  function presetChartUnit(preset) {
    if (preset === "7") return "day";
    if (preset === "30" || preset === "90") return "week";
    if (preset === "180" || preset === "year") return "month";
    if (preset === "all") return "year";
    return "week";
  }

  function presetComparisonUnit(preset) {
    if (preset === "7") return "week";
    if (preset === "30" || preset === "90") return "month";
    if (preset === "180") return "quarter";
    if (preset === "year" || preset === "all") return "year";
    return "week";
  }

  async function allVisitDateRange(fallbackEnd) {
    const records = SERVER_MODE ? await loadRecords() : allRecords;
    const dates = [];
    records.forEach(record => {
      visitDatesOf(record).forEach(date => {
        if (date <= fallbackEnd) dates.push(date);
      });
    });
    const uniqueDates = [...new Set(dates)].sort();
    return {
      start: uniqueDates[0] || fallbackEnd,
      end: uniqueDates[uniqueDates.length - 1] || fallbackEnd
    };
  }

  async function applyPreset(preset) {
    const y = addDays(today(), -1);  // 오늘 제외 → 어제까지
    const yDate = new Date(y + "T00:00:00");
    let start = y, end = y;
    if (preset === "7") { start = addDays(y, -6); end = y; }
    else if (preset === "30") { start = addDays(y, -29); end = y; }
    else if (preset === "90") { start = addDays(y, -89); end = y; }
    else if (preset === "180") { start = addDays(y, -179); end = y; }
    else if (preset === "year") { start = `${y.slice(0, 4)}-01-01`; end = y; }
    else if (preset === "all") {
      $("status").textContent = "전체 기간 계산 중...";
      const range = await allVisitDateRange(y);
      start = range.start;
      end = range.end;
    }
    $("startDate").value = start;
    $("endDate").value = end;
    $("chartUnit").value = presetChartUnit(preset);
    chartUnitTouched = true;
    setComparisonPeriodDefaults(end, true);
    setComparisonUnit(presetComparisonUnit(preset));
    setComparisonGraphUnit(comparisonDetailUnit(comparisonUnit));
    setPresetActive(preset);
    run();
  }

  let lastResult = null;  // CSV용 마지막 집계 결과
  let chartUnitTouched = false;
  let comparisonUnit = "week";
  let comparisonGraphUnit = "day";
  const operationalTrendMode = "actual";

  async function refreshPeriodComparisonOnly() {
    if (!lastResult) return;
    const comparison = await loadPeriodComparison(lastResult.start, lastResult.end, $("doctorFilter").value, lastResult.chartUnit || "day");
    lastResult.comparisonUnit = "range";
    lastResult.comparison = comparison;
    renderPeriodComparisonChart(comparison, "range");
  }

  function escapePeriodReportHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
  }

  function periodReportRate(value) {
    return `${(Number(value || 0) * 100).toFixed(1)}%`;
  }

  function periodReportChangeClass(text) {
    const value = String(text || "");
    if (value.includes("▲")) return "increase";
    if (value.includes("▼")) return "decrease";
    return "neutral";
  }

  function periodFollowupComparisonText(currentRate, previousRate, previousDenominator) {
    if (!Number(previousDenominator || 0)) return "－ 비교 불가";
    const pointChange = (Number(currentRate || 0) - Number(previousRate || 0)) * 100;
    const direction = pointChange > 0 ? "▲" : pointChange < 0 ? "▼" : "－";
    return `${direction} ${Math.abs(pointChange).toFixed(1)}%p`;
  }

  function renderPeriodReport(data) {
    const followup = data.followup || {};
    const previousFollowup = data.previousFollowup || {};
    const followupRows = ["all", "chuna", "noChuna", "simple", "complex"]
      .filter(key => followup[key])
      .map(key => ({ ...followup[key], previous: previousFollowup[key] || {} }));

    $("periodReportResult").innerHTML = `
      <div class="period-report-section"><h3>초진 코호트 재진·삼진율</h3>
        <div class="period-report-period">초진 기간 ${escapePeriodReportHtml(data.cohortStart)} ~ ${escapePeriodReportHtml(data.cohortEnd)} · 초진일부터 21일 추적</div>
        <table><thead><tr><th>초진 치료</th><th>초진</th><th>재진 도달</th><th>재진율</th><th>이전 기간 비교</th><th>삼진 도달</th><th>삼진율</th><th>이전 기간 비교</th></tr></thead><tbody>
          ${followupRows.map(row => {
            const returnComparison = periodFollowupComparisonText(row.returnRate, row.previous.returnRate, row.previous.patients);
            const thirdComparison = periodFollowupComparisonText(row.thirdVisitRate, row.previous.thirdVisitRate, row.previous.patients);
            return `<tr><td>${escapePeriodReportHtml(row.label)}</td><td>${Number(row.patients || 0).toLocaleString()}</td><td>${Number(row.returned || 0).toLocaleString()}</td><td>${periodReportRate(row.returnRate)}</td><td><span class="period-report-change ${periodReportChangeClass(returnComparison)}">${escapePeriodReportHtml(returnComparison)}</span></td><td>${Number(row.thirdVisit || 0).toLocaleString()}</td><td>${periodReportRate(row.thirdVisitRate)}</td><td><span class="period-report-change ${periodReportChangeClass(thirdComparison)}">${escapePeriodReportHtml(thirdComparison)}</span></td></tr>`;
          }).join("")}
        </tbody></table>
        <div class="period-report-note">추나군은 초진 당일 단추·복추·기존 추나 중 하나 이상을 시행한 환자입니다. 이 수치는 관찰된 연관성이며 치료 효과의 인과관계를 의미하지 않습니다.</div>
      </div>`;
  }

  let periodReportRequestId = 0;

  async function createPeriodReport(requestedStart, requestedEnd) {
    let start = requestedStart || $("startDate").value;
    let end = requestedEnd || $("endDate").value;
    if (!start || !end) {
      $("periodReportStatus").textContent = "시작일과 종료일을 확인해주세요.";
      $("periodReportStatus").classList.add("error");
      return;
    }
    if (start > end) [start, end] = [end, start];
    const requestId = ++periodReportRequestId;
    $("periodReportPrintBtn").disabled = true;
    $("periodReportStatus").classList.remove("error");
    $("periodReportStatus").textContent = "";
    try {
      const res = await fetch(`/api/reports/period?${new URLSearchParams({ start, end })}`, { cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `리포트 생성 실패 (${res.status})`);
      if (requestId !== periodReportRequestId) return;
      renderPeriodReport(data);
      $("periodReportPrintBtn").disabled = false;
      $("periodReportStatus").textContent = "";
    } catch (error) {
      if (requestId !== periodReportRequestId) return;
      $("periodReportResult").innerHTML = "";
      $("periodReportStatus").textContent = error?.message || String(error);
      $("periodReportStatus").classList.add("error");
    }
  }

  function printPeriodReport() {
    const start = lastResult?.start || $("startDate").value;
    const end = lastResult?.end || $("endDate").value;
    const originalTitle = document.title;
    if (start && end) document.title = `${start}_${end}`;
    document.body.classList.add("period-report-printing");
    const cleanup = () => {
      window.removeEventListener("afterprint", cleanup);
      document.body.classList.remove("period-report-printing");
      document.title = originalTitle;
    };
    window.addEventListener("afterprint", cleanup, { once: true });
    try {
      window.print();
      setTimeout(cleanup, 0);
    } catch (error) {
      window.removeEventListener("afterprint", cleanup);
      cleanup();
      throw error;
    }
  }

  async function run() {
    let start = $("startDate").value;
    let end = $("endDate").value;
    if (!start || !end) { $("status").textContent = "시작일과 종료일을 선택하세요."; return; }
    if (start > end) { [start, end] = [end, start]; $("startDate").value = start; $("endDate").value = end; }
    const docFilter = $("doctorFilter").value;
    const docLabel = docFilter || "전체";
    if (!chartUnitTouched) $("chartUnit").value = defaultChartUnit(start, end);
    const chartUnit = $("chartUnit").value || "week";
    const unitLabel = { day: "일", week: "주", month: "월", quarter: "분기", year: "년" }[chartUnit] || "주";
    $("status").classList.remove("error");
    $("status").textContent = "";
    $("periodReportPrintBtn").disabled = true;
    try {
      const previousEnd = addDays(start, -1);
      const previousStart = addDays(previousEnd, -(rangeDays(start, end) - 1));
      const includeYearAgo = end < addMonths(start, 12);
      const yearAgoStart = addMonths(start, -12);
      const yearAgoEnd = addMonths(end, -12);
      const statsLoader = SERVER_MODE
        ? (from, to, unit = chartUnit) => loadServerStats(from, to, docFilter, unit)
        : (from, to, unit = chartUnit) => Promise.resolve(computeStats(from, to, docFilter, unit));
      const [s, previousStats, yearAgoStats] = await Promise.all([
        statsLoader(start, end),
        statsLoader(previousStart, previousEnd),
        includeYearAgo ? statsLoader(yearAgoStart, yearAgoEnd) : Promise.resolve(null)
      ]);
      const trendRows = markRecentFollowupRates(s.trendStats, chartUnit, addDays(today(), -21));
      const comparison = {
        current: { start, end },
        previous: { start: previousStart, end: previousEnd },
        yearAgo: includeYearAgo ? { start: yearAgoStart, end: yearAgoEnd } : null,
        currentStats: s,
        previousStats,
        yearAgoStats,
        detailUnit: chartUnit
      };
      const recordCount = SERVER_MODE ? Number(s.recordCount || 0) : allRecords.length;
      $("rangeLabel").textContent = `조회 기간: ${start} ~ ${end} · 원장: ${docLabel} · 그래프: ${unitLabel} 단위 (전체 ${recordCount.toLocaleString()}명 환자 기준)`;
      renderDiagnosisStats(s);
      renderRetentionStats(s);
      renderSummary(s, previousStats);
      renderFinancialStats(s, previousStats);
      renderOperationalTrendChart(trendRows, chartUnit);
      renderPeriodComparisonChart(comparison, "range");
      renderHourlyPatientHeatmap(s.weekdayHourlyStats || {}, s.unknownTimeVisits, s.weekdayCounts || {});
      renderCountTable("treatmentTableWrap", s.treatmentCounts, { gold: true, limit: 10, expandable: true });
      renderCountTable("comboTableWrap", s.treatmentComboCounts, { gold: true, limit: 10 });
      lastResult = { start, end, docLabel, chartUnit, comparisonUnit: "range", stats: s, trendRows, comparison };
      $("periodReportPrintBtn").disabled = false;
    } catch (e) {
      $("status").textContent = "오류: " + (e?.message || e);
      $("status").classList.add("error");
    }
  }

  async function reload() {
    $("status").textContent = "DB 읽는 중...";
    try {
      if (SERVER_MODE) {
        allRecords = [];
        await populateServerDoctorFilter();
      } else {
        allRecords = await loadRecords();
        populateDoctorFilter();
      }
      $("status").classList.remove("error");
      $("status").textContent = "";
    } catch (e) {
      allRecords = [];
      $("status").textContent = "오류: " + (e?.message || e);
      $("status").classList.add("error");
    }
  }

  document.querySelectorAll(".preset-btn").forEach(b => b.addEventListener("click", () => { applyPreset(b.dataset.preset); }));
  $("applyBtn").addEventListener("click", () => { chartUnitTouched = false; setPresetActive(""); run(); });
  $("doctorFilter").addEventListener("change", run);
  $("chartUnit").addEventListener("change", () => { chartUnitTouched = true; run(); });
  $("periodReportPrintBtn").addEventListener("click", printPeriodReport);
  renderChartMetricToggles();
  disableAutocomplete();
  $("chartMetricToggles").addEventListener("click", event => {
    const chip = event.target?.closest?.(".chart-metric-chip");
    if (!chip) return;
    chip.classList.toggle("active");
    if (lastResult) {
      renderOperationalTrendChart(lastResult.trendRows || lastResult.stats.trendStats, lastResult.chartUnit);
    }
  });
  $("periodComparisonMetricToggles").addEventListener("click", event => {
    const chip = event.target?.closest?.(".comparison-chart-metric-chip");
    if (!chip) return;
    chip.classList.toggle("active");
    if (lastResult) renderPeriodComparisonChart(lastResult.comparison, lastResult.comparisonUnit);
  });

  // ── 기간 요약 데이터 추출 (복사 → Claude.ai 등에 붙여넣기) ──────────
  const AI_SUMMARY_LABELS = { week: "주간", month: "월간", quarter: "분기", year: "연간" };
  let lastAiExportText = "";

  function closeAiSummary() {
    $("aiSummaryBackdrop").classList.remove("open");
  }

  async function copyTextToClipboard(text, sourceElement = null) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch {
        // 권한 거부 시 아래의 일반 HTTP 호환 방식으로 다시 시도한다.
      }
    }

    const textarea = sourceElement || document.createElement("textarea");
    const temporary = !sourceElement;
    if (temporary) {
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
    }
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    const copied = document.execCommand("copy");
    if (temporary) textarea.remove();
    if (!copied) throw new Error("브라우저가 클립보드 복사를 허용하지 않았습니다.");
  }

  async function copyAiPrompt() {
    const btn = $("aiSummaryCopyBtn");
    try {
      await copyTextToClipboard(lastAiExportText, $("aiSummaryPromptBox"));
      btn.textContent = "복사됨!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "데이터 복사"; btn.classList.remove("copied"); }, 1500);
    } catch (error) {
      $("aiSummaryPromptBox").select();
      alert(`${error?.message || "자동 복사에 실패했습니다."}\n텍스트가 선택되었으니 Ctrl+C로 복사해주세요.`);
    }
  }

  async function openAiSummary(period) {
    const label = AI_SUMMARY_LABELS[period] || "기간";
    $("aiSummaryTitle").textContent = `${label} 요약`;
    $("aiSummaryRange").textContent = "";
    $("aiSummaryBackdrop").classList.add("open");
    if (!SERVER_MODE) {
      $("aiSummaryBody").innerHTML = `<div class="ai-summary-error">이 기능은 서버 모드(http)에서만 사용할 수 있습니다.</div>`;
      return;
    }
    $("aiSummaryBody").innerHTML = `<div class="ai-summary-loading">${label} 데이터를 모으는 중입니다...</div>`;
    try {
      const res = await fetch(`/api/ai/period-summary-prompt?${new URLSearchParams({ period })}`, { cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || `데이터 생성 실패 (${res.status})`);
      lastAiExportText = data.prompt || "";
      const baselineText = data.baselineRange ? ` · ${data.baselineRange.label} ${data.baselineRange.start} ~ ${data.baselineRange.end}` : "";
      $("aiSummaryRange").textContent = `이번 기간 ${data.range.start} ~ ${data.range.end} · 직전 기간 ${data.previousRange.start} ~ ${data.previousRange.end} · 전년 동기 ${data.yearAgoRange.start} ~ ${data.yearAgoRange.end}${baselineText}`;
      $("aiSummaryBody").innerHTML = `
        <div class="ai-summary-hint">기간별 변동성을 보정한 비교 기준과 장기 추이, 기간 요약·시간대별 환자 수(전체 + 원장별), 원장별 진료 건수를 모았습니다. 아래 내용을 복사해 AI에 붙여넣어 분석을 요청할 수 있습니다. 환자 개인정보는 포함되어 있지 않습니다.</div>
        <textarea class="ai-summary-prompt" id="aiSummaryPromptBox" readonly></textarea>
        <div class="ai-summary-actions">
          <button class="ai-summary-copy-btn" id="aiSummaryCopyBtn" type="button">데이터 복사</button>
        </div>
      `;
      $("aiSummaryPromptBox").value = lastAiExportText;
      $("aiSummaryCopyBtn").addEventListener("click", copyAiPrompt);
    } catch (error) {
      $("aiSummaryBody").innerHTML = `<div class="ai-summary-error">${escapeHtml(error?.message || String(error))}</div>`;
    }
  }

  document.querySelectorAll("[data-ai-period]").forEach(btn => {
    btn.addEventListener("click", () => openAiSummary(btn.dataset.aiPeriod));
  });
  $("aiSummaryCloseBtn").addEventListener("click", closeAiSummary);
  $("aiSummaryBackdrop").addEventListener("click", event => {
    if (event.target === $("aiSummaryBackdrop")) closeAiSummary();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && $("aiSummaryBackdrop").classList.contains("open")) closeAiSummary();
  });

  // 초기: 최근 30일 전체를 기본 로드
  (async () => {
    await reload();
    await applyPreset("30");
  })();
</script>
</body>
</html>
